# Dependencies held back ON PURPOSE, each with its reason and a date to look again.
#
# req:reflow2-keeps-its-dependencies-at-or-near-their-latest-releases (accepted
# 2026-10-02): "a dependency held back carries a written reason and a date to look
# again. An exception is recorded, never silent." tools/dependency_currency.py reads
# this file. Anything behind a new major or 0.x series with no entry here fails the
# `dependencies` workflow, and so does an entry whose look_again date has passed. An
# entry for something that is no longer behind is reported, so remove it when its
# bump lands.
#
#   kind       = "crate" | "action" | "toolchain"
#   name       = the crate name, the action's owner/repo, or "rust-version"
#   reason     = why, in a sentence somebody else can check
#   look_again = a date (YYYY-MM-DD) after which this hold stops counting

[[hold]]
kind = "crate"
name = "jsonwebtoken"
reason = "12.0.0 is a new major. bearer.rs verifies sign-in tokens through jsonwebtoken's crypto-provider API (JwtVerifier, signature::Verifier, its key and error types), so the bump is security code and gets its own PR, with the bearer tests run against it, rather than riding along with the toolchain pin (PR #837)."
look_again = 2026-11-27
