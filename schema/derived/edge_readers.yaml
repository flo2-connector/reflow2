# Every function in crates/reflow2-core/src that NAMES AN EDGE TYPE — directly, through a
# const or static table, or through the schema's inference-edge selector — and that no
# derived-relation declaration answers for (none names it, and no `dedicated` function of
# one reaches it). crates/reflow2-core/tests/derived_relations_are_declared_and_checked.rs
# holds this list to the code both ways: a function that names an edge and is on neither
# side fails, a listed function reading a DIFFERENT set of edges fails, and an entry for a
# function that is gone, reads nothing, or is now declared fails.
#
# WHY A LIST AND NOT A DETECTOR. Whether a function DERIVES a relation is a judgement about
# meaning. A writer, a guard, a one-hop projection, a detector and a derivation all name
# edge types the same way, so no scanner can tell them apart; the graph-primitives study
# found reflow2's 23 derived relations by reading the code. What CAN be mechanical is the
# population, and that every member of it has been looked at: a new function that reads
# an edge, or an old one that starts reading a new edge type, is where a new derived
# relation starts, and it fails the build until somebody declares it in relations.yaml or
# lists it here with a reason.
# (fact:root-cause-the-derived-declaration-check-draws-every-population-from-the-declarations-it-checks-2026-09-29)
#
# kind
#   unjudged     on this list when it was first drawn, 2026-09-29, from reflow2 at 87f17ec;
#                NOBODY HAS SAID whether it derives a relation. Some surely do: most of the
#                detect_* functions compute a relation's complement, and several reports
#                compose relations. This is a baseline, not a verdict, and it only shrinks —
#                the test pins the count, and a new entry is never unjudged.
#   not_derived  judged: `why` says what it does instead of deriving a relation.
#
# edges: the edge types it names, as the scanner reads them.

