# reflow2's DERIVED relations — what reflow2 COMPUTES from what it stores, declared
# as data beside the edge readings (schema/*.yaml `reading`, #621) and in the same
# vocabulary: the sixteen primitives with their operators.
#
# req:reflow2-declares-its-derived-relations-and-serves-a-read-that-runs-them.
# Until 2026-09-29 reflow2 declared NONE of these: 23 derived relations lived only as
# hand-written code across ~15 files, and the only list of them was the
# graph-primitives study's hand-kept file (analysis/classified/reflow2/derived.jsonl),
# which this file started from and re-anchors to the code as it stands.
#
# A DECLARATION BESIDE HAND-WRITTEN CODE IS A SECOND COPY, honest only while a test
# holds it to the code. crates/reflow2-core/tests/derived_relations_are_declared_and_checked.rs
# is that test, and each of its checks starts from a population THIS FILE DOES NOT CHOOSE
# (fact:root-cause-the-derived-declaration-check-draws-every-population-from-the-declarations-it-checks-2026-09-29:
# the first version checked only what this file named, one call deep, and missed
# readiness_gate's HAS_READINESS, impact's inference and risk edges, two `over`s and 13
# padded components lists). It fails when:
#   · a named function does not exist, or is a writer (takes &mut self);
#   · an edge the declaration lists is read by nothing its functions REACH, at any depth;
#   · anything a `dedicated` function reaches through calls, at any depth, reads an edge
#     the declaration (or a relation in its `over`, transitively) does not list — named
#     directly, through a const table, or through the schema's inference-edge selector;
#   · a `dedicated` function reaches another relation's own code and `over` does not name it;
#   · a function anywhere in reflow2-core names an edge type, no declaration answers for
#     it, and schema/derived/edge_readers.yaml does not list it with the edges it reads;
#   · `components` is not exactly the primitives the composition writes;
#   · a declared edge's reading shares no primitive with the rule's composition (its own,
#     or one it is `over`), and `not_yet_stated` does not name the edge;
#   · a declaration has no evaluator in the served read, or an evaluator has no declaration.
# It cannot check that the RULE computes what the code computes: that needs rules a
# machine evaluates (the planned rule engine).
#
# FIELDS
#   name        the relation, as the study names it.
#   reading     the relation's own reading, in the shape of an edge reading (form,
#               composition, components): what it MEANS in the primitives. `components`
#               is exactly the primitives the composition writes — what the rule is
#               built from, never the primitives of the edges it happens to read.
#   rule        what it computes, written over the declared readings where it can be.
#   stated_over_readings
#               full    — every term of the rule is an edge reading reflow2 declares;
#               partial — some term is a node property, a status, arithmetic or a
#                         per-edge choice that no declared reading carries yet
#                         (`not_yet_stated` says which);
#               none    — the rule reads no edge at all.
#   inference   deduced (follows from the declared facts) or induced (generalised
#               from observations). Every relation here is deduced.
#   edges       the edge types the rule reads.
#   over        other derived relations this one is computed over.
#   code        where the code computes it; `dedicated: true` when the function
#               computes nothing else, so every edge it REACHES must be declared here.
#   counts      what ONE derived fact of it is, for the served read's tally.
#   cost        bounded (a pass over the design), report (reuses a whole report),
#               detectors (runs gap detection), closure (a transitive closure,
#               not counted by default).
#
# NOTHING HERE STORES ANYTHING. Whether a derived result is KEPT is open in
# dec:idea-which-derived-results-are-kept-and-by-what-rule, beside
# req:reflow2-keeps-the-knowledge-it-derives. It is the owner's call; the served read
# (`derived_report`) computes on read.
#
# Every reading below is basis: classified until the owner reviews it, like #621's.

relations:

  delivered:
    name: "delivered(requirement)"
    reading: { form: composite, composition: "delivered(r) := [∃c: norm·meets(+)(c, r) ∧ ¬discontinued(c) ∧ realized(c) ∧ checked(c)] ∨ [∃k: part-of(k, r) ∧ ∀k part-of(k, r): delivered(k)]", components: [norm, part-of] }
    rule: "A requirement is delivered when a capability that SATISFIES it (norm·meets) is realized and currently checked and not discontinued, or when it is decomposed (part-of) and every child is delivered. Dropped requirements and inferred ones are counted apart."
    stated_over_readings: partial
    not_yet_stated: "SATISFIES.coverage (partial/planned) is a modifier with no primitive of its own, and a requirement's `dropped` status and `inferred` provenance are node properties no reading declares."
    inference: deduced
    edges: [SATISFIES, DECOMPOSES, REALIZES, ALLOCATED_TO, VERIFIES, OBSOLETES]
    over: [realized, checked, discontinued]
    code:
      - { file: report.rs, function: requirement_is_delivered_within, dedicated: true }
      - { file: report.rs, function: delivery_coverage, dedicated: true }
      - { file: detect.rs, function: capability_is_realized, dedicated: false }
      - { file: verify.rs, function: capability_verification, dedicated: false }
      - { file: verify.rs, function: has_passing_verification, dedicated: false }
      - { file: graph.rs, function: decomposed_children, dedicated: true }
      - { file: detect.rs, function: is_discontinued, dedicated: false }
    counts: "one requirement delivered"
    cost: bounded

  realized:
    name: "realized(capability)"
    reading: { form: composite, composition: "realized(c) := ∃a: instance-of·realizes(a, c) ∨ ∃k: located-at(c, k) ∧ ∃a: instance-of·realizes(a, k)", components: [instance-of, located-at] }
    rule: "A capability is realized when an artifact REALIZES it (instance-of·realizes), or when a component it is ALLOCATED_TO (located-at) is realized."
    stated_over_readings: full
    inference: deduced
    edges: [REALIZES, ALLOCATED_TO]
    code:
      - { file: detect.rs, function: capability_is_realized, dedicated: true }
      - { file: detect.rs, function: realized_via_component, dedicated: true }
    counts: "one capability realized"
    cost: bounded

  checked:
    name: "checked(capability): Verified | ComponentVerified | Unchecked"
    reading: { form: composite, composition: "checked(c) := ∃v: norm·evaluates(v, c) ∧ verdict(v) = + ∨ ∃k: located-at(c, k) ∧ ∃v: norm·evaluates(v, k) ∧ verdict(v) = +", components: [norm, located-at] }
    rule: "A capability is checked when a Verification that VERIFIES it (norm·evaluates) is passing, or one that verifies a component it is ALLOCATED_TO (located-at) is passing."
    stated_over_readings: partial
    not_yet_stated: "the verdict is Verification.status = passing, a node property no reading declares."
    inference: deduced
    edges: [VERIFIES, ALLOCATED_TO]
    code:
      - { file: verify.rs, function: capability_verification, dedicated: true }
      - { file: verify.rs, function: has_passing_verification, dedicated: true }
    counts: "one capability Verified or ComponentVerified"
    cost: bounded

  discontinued:
    name: "discontinued(x)"
    reading: { form: composite, composition: "discontinued(x) := ∃d: norm·binds[forbidden](d, x) ∧ stance(+)(owner, d)", components: [norm, stance] }
    rule: "A node is discontinued when an ACCEPTED Decision OBSOLETES it (norm, forbidding)."
    stated_over_readings: partial
    not_yet_stated: "the owner's stance is Decision.status = accepted, a node property no reading declares."
    inference: deduced
    edges: [OBSOLETES]
    code:
      - { file: detect.rs, function: discontinued_ids, dedicated: true }
      - { file: detect.rs, function: is_discontinued, dedicated: true }
    counts: "one node discontinued"
    cost: bounded

  contract_pair:
    name: "contract pair (declared seam)"
    reading: { form: composite, composition: "contract(p, c) := ∃i: source-of·offers(p, i) ∧ causes·necessary(i, c), p ≠ c, unordered  ≈ flows-to(p, c) via conduit i", components: [source-of, causes, flows-to] }
    rule: "Two components share a declared seam when one PROVIDES (source-of) an Interface the other CONSUMES (causes), as an unordered pair."
    stated_over_readings: full
    inference: deduced
    edges: [PROVIDES, CONSUMES]
    code:
      - { file: maturity.rs, function: seam_sets_at, dedicated: false }
    counts: "one unordered component pair"
    cost: bounded

  coupling:
    name: "coupling (module level)"
    reading: { form: composite, composition: "coupling(a, b) := causes·necessary(b, a) ∨ causes·necessary(a, b), symmetrised", components: [causes] }
    rule: "Two components are coupled when either DEPENDS_ON (causes) the other; direction is discarded."
    stated_over_readings: full
    inference: deduced
    edges: [DEPENDS_ON]
    code:
      - { file: maturity.rs, function: seam_sets_at, dedicated: false }
    counts: "one unordered component pair"
    cost: bounded

  coupling_at_altitude:
    name: "coupling at altitude L / seam coverage"
    reading: { form: composite, composition: "coupling_L(A, B) := ∃a, b: part-of*(a, A) ∧ part-of*(b, B) ∧ instance-of(A, L) ∧ instance-of(B, L) ∧ coupling(a, b); covered when a contract pair lifts onto the same pair", components: [part-of, instance-of] }
    rule: "A coupling between two parts IS a coupling between the containers (CONTAINS, part-of⁻¹) that hold them at level L; a seam at L is covered when a contract pair lifts onto the same pair."
    stated_over_readings: partial
    not_yet_stated: "instance-of(A, L) is Component.level, a node property, and part-of* needs transitivity, which no reading declares as algebra yet."
    inference: deduced
    edges: [CONTAINS, DEPENDS_ON, PROVIDES, CONSUMES]
    over: [coupling, contract_pair]
    code:
      - { file: maturity.rs, function: seam_coverage, dedicated: true }
      - { file: maturity.rs, function: lift_to_level, dedicated: true }
      - { file: maturity.rs, function: seam_sets_at, dedicated: false }
    counts: "one coupling at a level, and one more when it is covered"
    cost: bounded

  impact:
    name: "impact / blast radius"
    reading: { form: composite, composition: "affected(x, y) := closure over { norm (binds, meets, evaluates), instance-of·realizes, located-at (allocation, deployment), causes (dependence), part-of (DECOMPOSES, INCLUDES, PART_OF_FLOW only), during (SCHEDULED_FOR), source-of (CALIBRATED_AGAINST only) } ∪ { every edge of the inference module, carried as causal whatever it reads as: causes (CAUSES, BLOCKS, TRIGGERS, RISKS, MITIGATES, MASKS), compares (CONTRADICTS, DUPLICATES), norm (VIOLATES, OBSOLETES), becomes (EVOLVES_INTO), before ∧ about (ANTICIPATES) }", components: [about, before, becomes, causes, compares, during, instance-of, located-at, norm, part-of, source-of] }
    rule: "Change propagates along a hand-kept table of edge types (structural_rule) with Upstream/Downstream/Lateral labels, and along every edge type of the schema's inference module as causal, transitively. Crossing a risk edge (RISK_EDGES: RISKS, BLOCKS, CONTRADICTS, VIOLATES, MASKS) marks the hop as a risk."
    stated_over_readings: partial
    not_yet_stated: "which relations carry change is decided per EDGE TYPE, not per primitive (part-of propagates along DECOMPOSES and INCLUDES but not CONTAINS; source-of along CALIBRATED_AGAINST but not AUTHORED_BY), and the inference edges are chosen by their schema MODULE, not their reading; the closure needs transitivity, which no reading declares as algebra yet."
    inference: deduced
    edges: [SATISFIES, DECOMPOSES, CONSTRAINS, ALLOCATED_TO, REALIZES, VERIFIES, GOVERNED_BY, PROVIDES, CONSUMES, DEPENDS_ON, PART_OF_FLOW, DEPLOYED_TO, REQUIRES_RESOURCE, INCLUDES, SCHEDULED_FOR, CALIBRATED_AGAINST, GATED_ON, CAUSES, BLOCKS, TRIGGERS, CONTRADICTS, VIOLATES, RISKS, MITIGATES, EVOLVES_INTO, OBSOLETES, DUPLICATES, ANTICIPATES, MASKS]
    code:
      - { file: nodes.rs, function: structural_rule, dedicated: true }
      - { file: propagate.rs, function: propagate_from, dedicated: true }
    counts: "one (seed, affected node) pair — not counted by default"
    cost: closure

  claimed_region:
    name: "claimed region, claim overlap"
    reading: { form: composite, composition: "region(c) := {s : causes[intended](c, Δ s) ∧ during(c, its claimant's live session)} ∪ {x : affected*(s, x), path length ≤ depth}; overlap(c1, c2) := region(c1) ∩ region(c2)", components: [causes, during] }
    rule: "A claim names a seed (CLAIMS); its ground is everything the impact relation reaches from the seed within `depth`; two claims overlap where their grounds meet."
    stated_over_readings: partial
    not_yet_stated: "it is computed over impact, which is not fully stated over readings, and `depth` is an edge property with no primitive."
    inference: deduced
    edges: [CLAIMS]
    over: [impact]
    code:
      - { file: claims.rs, function: claimed_region, dedicated: true }
      - { file: claims.rs, function: claim_report, dedicated: true }
      - { file: claims.rs, function: claims, dedicated: true }
    counts: "one node in a claim's region, and one per claim overlap"
    cost: bounded

  level_mismatch:
    name: "level mismatch / unknown level"
    reading: { form: composite, composition: "part-of(c, p) is expected to link ADJACENT rungs: instance-of(c, L_i) ∧ instance-of(p, L_i+1); causes(a, b) between peers is expected at most one rung apart: instance-of(a, L_i) ∧ instance-of(b, L_j) ∧ |i − j| ≤ 1", components: [part-of, instance-of, causes] }
    rule: "A CONTAINS (part-of⁻¹) edge between components that skips or inverts a rung of the Project's ladder, a DEPENDS_ON across levels, or a level not on the ladder, is a hierarchy issue."
    stated_over_readings: partial
    not_yet_stated: "the rung is Component.level and the ladder is Project.decomposition_levels — node properties no reading declares."
    inference: deduced
    edges: [CONTAINS, DEPENDS_ON]
    code:
      - { file: hierarchy.rs, function: hierarchy_issues, dedicated: true }
    counts: "one hierarchy issue"
    cost: bounded

  rerun_owed:
    name: "rerun owed (stale finding)"
    reading: { form: composite, composition: "rerun_owed(f) := ∃r, y: about(f, y) ∧ causes(r, Δy) ∧ before(run(f), r); three-valued", components: [causes, before, about] }
    rule: "A check owes a rerun when something that INVALIDATES it happened after it last ran; unknown when either date is missing."
    stated_over_readings: partial
    not_yet_stated: "before() is computed from two time properties, one on the edge (`at`) and one on the node (`last_run_at`)."
    inference: deduced
    edges: [INVALIDATES]
    code:
      - { file: verify.rs, function: invalidated_findings, dedicated: true }
      - { file: verify.rs, function: invalidated_among, dedicated: true }
    counts: "one invalidated check with its three-valued verdict"
    cost: bounded

  requirement_certainty:
    name: "requirement certainty (user-confirmed · asserted · recovered)"
    reading: { form: composite, composition: "certainty(r) := stance(+)(owner, r) ? confirmed : (source-of(inferred process, r) ? recovered : asserted)", components: [stance, source-of] }
    rule: "Status × provenance: accepted or met → user-confirmed; provenance inferred → recovered; otherwise asserted."
    stated_over_readings: none
    not_yet_stated: "both terms are node properties (status, provenance); the relation reads no edge."
    inference: deduced
    edges: []
    code:
      - { file: report.rs, function: requirement_certainty, dedicated: true }
      - { file: report.rs, function: requirement_certainty_breakdown, dedicated: true }
    counts: "one grade per requirement"
    cost: bounded

  gaps_on_owned_ground:
    name: "gaps on owned ground"
    reading: { form: composite, composition: "on_ground(g, p) := ∃x: about(g, x) ∧ controls·owns(p, x)", components: [about, controls] }
    rule: "An open gap stands on a person's ground when it concerns (about) a node that person OWNS (controls)."
    stated_over_readings: partial
    not_yet_stated: "gaps are computed by the detectors, not stored, so about(g, x) is no edge."
    inference: deduced
    edges: [OWNED_BY]
    code:
      - { file: report.rs, function: loop_status_for, dedicated: false }
      - { file: graph.rs, function: owned_by_contributor, dedicated: true }
    counts: "one gap on one owner's ground"
    cost: detectors

  assigned_decision:
    name: "assigned decision ('marked')"
    reading: { form: composite, composition: "assigned(d, p) := stance[approver](p, d) ∧ ¬stance(+)(owner, d) ⇒ norm·binds(p, settle d) — an approver on a still-open decision owes its ruling", components: [norm, stance] }
    rule: "A proposed Decision with an AUTHORED_BY edge whose roles include approver is assigned to that person. The same edge and role mean 'the owner's word was given' once the decision is accepted."
    stated_over_readings: partial
    not_yet_stated: "`proposed` is Decision.status, a node property; one encoding carries two relations told apart only by the target's status."
    inference: deduced
    edges: [AUTHORED_BY]
    code:
      - { file: report.rs, function: loop_status_for, dedicated: false }
    counts: "one decision assigned to one person"
    cost: detectors

  shaping_decisions:
    name: "shaping decisions"
    reading: { form: composite, composition: "shaping(d) := |{x live : norm·binds(d, x)}| for d with stance(+)(owner, d)", components: [norm, stance] }
    rule: "An accepted Decision, ranked by the number of live nodes GOVERNED_BY it."
    stated_over_readings: partial
    not_yet_stated: "`accepted` and liveness are node properties; the rank is arithmetic."
    inference: deduced
    edges: [GOVERNED_BY]
    code:
      - { file: report.rs, function: what_next, dedicated: false }
    counts: "one shaping decision"
    cost: report

  simulation_only:
    name: "proven only in simulation"
    reading: { form: composite, composition: "sim_only(c) := ∃v: norm·evaluates(v, c) ∧ verdict(v) = + ∧ ∀e: located-at(v, e) → about(e, a place) rather than a place", components: [norm, located-at, about] }
    rule: "A capability whose passing checks were all PERFORMED_IN a simulation environment."
    stated_over_readings: partial
    not_yet_stated: "Environment.env_type = simulation and Verification.status are node properties; 'a representation of a place' has no reading."
    inference: deduced
    edges: [VERIFIES, PERFORMED_IN]
    code:
      - { file: verify.rs, function: evidence_report, dedicated: false }
    counts: "one capability proven only in simulation"
    cost: report

  unresolved_setup:
    name: "unresolved setup"
    reading: { form: composite, composition: "unresolved(x, y) := before(x, y) ∧ about(x, y) ∧ ¬becomes(y, ·) ∧ ¬arrived(y)", components: [before, about, becomes] }
    rule: "An ANTICIPATES edge whose target has no EVOLVES_INTO and has not reached its type's arrival status."
    stated_over_readings: partial
    not_yet_stated: "arrival is a per-type status value (Decision accepted, Capability realized, …), a node property."
    inference: deduced
    edges: [ANTICIPATES, EVOLVES_INTO]
    code:
      - { file: heal.rs, function: all_defects, dedicated: false }
      - { file: heal.rs, function: follow_through_exists, dedicated: true }
    counts: "one unresolved setup"
    cost: detectors

  budget_rollup:
    name: "budget rollup / budget closes"
    reading: { form: composite, composition: "for each live budget c (¬discontinued(c)): total(c) := Σ quantity carried on norm·binds(c, x) when it composes as a sum, or the heaviest path of arc(a, b) := causes(a, b) ∨ ∃i: source-of·offers(b, i) ∧ causes(a, i) among its contributors when it composes along a path; compares(total, limit)", components: [norm, compares, causes, source-of] }
    rule: "Each budget's contributions (CONSTRAINS, norm) in its unit are summed, or taken along the heaviest DEPENDS_ON path when the budget declares `composition: path`, and compared with its limit."
    stated_over_readings: partial
    not_yet_stated: "contribution, unit and limit are quantities (modifiers) and the verdict is arithmetic; compares has no edge of its own here."
    inference: deduced
    edges: [CONSTRAINS, DEPENDS_ON, PROVIDES, CONSUMES]
    over: [discontinued]
    code:
      - { file: budget.rs, function: budget_report, dedicated: true }
      - { file: budget.rs, function: budget_reports, dedicated: true }
      - { file: budget.rs, function: worst_path, dedicated: true }
    counts: "one judged rollup per budget"
    cost: bounded

  allocation_scores:
    name: "allocation cohesion and coupling"
    reading: { form: composite, composition: "coupling(k1, k2) := Σ strength of causes·necessary(b, a) with located-at(a, k1) ∧ located-at(b, k2)", components: [causes, located-at] }
    rule: "Function-level dependence (DEPENDS_ON between capabilities) lifted to structure through allocation (ALLOCATED_TO): internal weight is cohesion, cross-component weight is coupling."
    stated_over_readings: partial
    not_yet_stated: "the weights are arithmetic over a strength modifier, and DEPENDS_ON is summed whatever its dependency_type, so a data-flow dependency (which reads as flows-to) is counted as causes here."
    inference: deduced
    edges: [ALLOCATED_TO, DEPENDS_ON]
    code:
      - { file: allocate.rs, function: evaluate_allocation, dedicated: true }
      - { file: allocate.rs, function: current_allocation_map, dedicated: true }
      - { file: allocate.rs, function: capability_dependencies, dedicated: true }
    counts: "one cohesion and coupling score per component"
    cost: bounded

  flow_step_order:
    name: "flow step order"
    reading: { form: composite, composition: "before(c1, c2) := part-of(c1, f) ∧ part-of(c2, f) ∧ order(c1) < order(c2)", components: [part-of, before] }
    rule: "PART_OF_FLOW (part-of, before) edges carry step_order, which sorts a flow's steps; TRIGGERS between steps is read beside it."
    stated_over_readings: partial
    not_yet_stated: "order(c) is PART_OF_FLOW.step_order, an edge property; entry and exit points are node properties. flow_report also reads TRIGGERS, for the transitions it lists beside the order; a transition does not order steps, so the composition does not state it."
    inference: deduced
    edges: [PART_OF_FLOW, TRIGGERS]
    code:
      - { file: flow.rs, function: flow_report, dedicated: true }
    counts: "one ordered pair of steps in one flow"
    cost: bounded

  readiness_gate:
    name: "readiness gate met"
    reading: { form: composite, composition: "gate(i, t) := causes[necessary](level(t) ≥ min_level, delivery(i)), where level(t) := max value(r) over measures(r, t) on the gate's ladder, the threshold min_level is a norm, and the gate clears at the earliest epoch e with a forecast f: about(f, t) ∧ during(f, from e) ∧ value(f) ≥ min_level", components: [causes, measures, norm, about, during] }
    rule: "A GATED_ON gate is met when the target's best measured readiness (HAS_READINESS) on the gate's ladder reaches its minimum; when it does not, the gate clears at the earliest epoch a dated forecast (HAS_TEMPORAL_FACT, VALID_FROM) reaches it."
    stated_over_readings: partial
    not_yet_stated: "the level and the threshold are quantities, and value ≥ threshold is arithmetic."
    inference: deduced
    edges: [GATED_ON, HAS_READINESS, HAS_TEMPORAL_FACT, VALID_FROM]
    code:
      - { file: readiness.rs, function: readiness_report, dedicated: true }
    counts: "one gate judged"
    cost: bounded

  arrival_delta:
    name: "arrival delta"
    reading: { form: composite, composition: "arrival(e) := for x with norm[modality](during(delivered(x), ≤ e)): compares(plan(x, e), outcome(x)), where plan(x, e) is read off same-as·snapshot(s, the schedule) ∧ during·belongs-to(s, e), and outcome(x) is delivered, realized or checked by x's type", components: [norm, during, compares, same-as] }
    rule: "For an epoch or release, every item SCHEDULED_FOR it is classified delivered, outstanding, deferred or discontinued against its plan."
    stated_over_readings: partial
    not_yet_stated: "the classification reads statuses (node properties) and compares plan with outcome, which is arithmetic."
    inference: deduced
    edges: [SCHEDULED_FOR, AT_EPOCH, HAS_SNAPSHOT]
    over: [delivered, realized, checked]
    code:
      - { file: temporal.rs, function: arrival_delta, dedicated: true }
      - { file: temporal.rs, function: live_schedule, dedicated: true }
      - { file: temporal.rs, function: scheduled_item, dedicated: true }
      - { file: temporal.rs, function: snapshots_of, dedicated: true }
    counts: "one scheduled item classified"
    cost: bounded

  closure:
    name: "closure (five legs)"
    reading: { form: composite, composition: "closes := each declared leg's share ≥ threshold; the decisions leg is ¬∃d: norm[scheduled](x, e planned) ∧ norm·binds(d, x) ∧ ¬stance(+)(owner, d)", components: [norm, stance] }
    rule: "A relation over derived relations: traceability (delivered), budgets (budget rollup), seams (coupling at altitude), decisions (scheduled work GOVERNED_BY an open decision) and provenance (quantities with a source), each against the owner's declared threshold, read in a design and a build phase."
    stated_over_readings: partial
    not_yet_stated: "thresholds and shares are arithmetic, and decision status is a node property."
    inference: deduced
    edges: [GOVERNED_BY, SCHEDULED_FOR, CONSTRAINS, IMPLEMENTS, VERIFIES]
    over: [delivered, budget_rollup, coupling_at_altitude]
    code:
      - { file: closure.rs, function: closure_report, dedicated: true }
