# inference.yaml — the "why" layer.
#
# Edges that capture WHY things relate, not just WHAT connects to WHAT. All use
# wildcard endpoints (from/to "*") so the intelligence layer sits above the
# whole catalog. Adapted from Reflow's inference set and validated against
# storyflow's proven causal edge vocabulary.
#
# Each edge carries `confidence` (0..1) and free-text `evidence` so extraction
# can record how strongly the link is asserted and cite the source text.
#
# Since 2026-10-14 it also holds the STATED INFERENCE STEP — the `Inference`
# node and its two links, PREMISE_OF and CONCLUDES — which say how premises
# support a conclusion by a rule reflow2 checks. Those two links pin one end to
# the step, and they carry no `inference_category` (see below).

schema:
  name: inference
  version: 1

  node_types:

    # A STATED INFERENCE STEP (req:a-design-states-how-premises-support-a-conclusion-and-reflow2-checks-it-follows,
    # shaped by dec:an-inference-is-a-record-between-premises-and-conclusion, both
    # Anthony's, 2026-10-14). A record of its own BETWEEN the premises and the
    # conclusion — his picture's "Operation" box — so its warrant can itself be
    # challenged, verified or go stale. Premises link in (PREMISE_OF), the one
    # conclusion links out (CONCLUDES), and the rule says how they combine.
    #
    # NOT a setting on the conclusion (it could not name a rule or later record
    # who confirmed the step) and NOT one on each link (any one and k of n belong
    # to the group of premises, not to one link). A conclusion with no Inference
    # reads exactly as it always has: delivery still rolls a decomposition up by
    # an unwritten AND. The code is crates/reflow2-core/src/inference.rs.
    Inference:
      properties:
        name: { type: string, indexed: true, fulltext: true, description: "A short handle for the step — what search_design and the reports render. Optional: add_inference composes one from the rule and the conclusion when none is given." }
        rule: { type: enum, values: [all, any, k_of_n, immediate], default: all, indexed: true, description: "HOW THE PREMISES SUPPORT THE CONCLUSION, as a combination reflow2 checks over each premise's computed truth — holds, fails or unknown, evaluated three-valued: `all` — every premise must hold (AND: one failing premise fails the step, and with none failing an unknown one leaves it unknown); `any` — one holding premise is enough (OR: redundant support, alternative grounds); `k_of_n` — at least `k` of the premises must hold (a quorum, two-out-of-three voting). `all` is the default and says nothing new: it is the AND delivery has always applied to a decomposition, written down. A NAMED RULE IS CHECKED BY ITS COMBINATION: modus ponens is `all` over P and P → Q, with `rule_name: modus ponens`. `immediate` says the step is NOT AN INFERENCE (req:a-step-can-say-it-is-not-an-inference, Anthony 2026-10-18): the conclusion is grasped directly — by intuition, self-evidence or a self-verifying act — rather than derived. Any premises are what it is grasped IN, read as `all`; with none it holds on the grasp alone. It reads \"not an inference\", and an objection can still aim at it." }
        k: { type: int, description: "For `k_of_n` only: how many premises must hold. Required with that rule and refused with any other; 1 ≤ k ≤ the number of premises, checked when the step is written with its premises (add_inference). A step whose premises were later removed below k reads `unknown` and says why, never `holds`." }
        rule_name: { type: string, indexed: true, fulltext: true, description: "The rule's name in its own field, free text — `modus ponens`, `induction`, `redundant sensors`, `two-out-of-three voting`. A LABEL, NOT A CHECK: reflow2 checks the step by its `rule` (the combination) and never by this name." }
        warrant: { type: string, fulltext: true, description: "WHY these premises support this conclusion, in the author's words — the part of the step a person can challenge. reflow2 records it and never judges it." }
        confirmed_by: { type: string, indexed: true, description: "WHO confirmed this step: a contributor id (`who:jane`) or a proof checker's name. Absent means unconfirmed — a model's narration, not yet checked by a person or a program." }
        confirmed_how: { type: enum, values: [unconfirmed, person, checker], default: unconfirmed, indexed: true, description: "HOW the step was confirmed: `person` — a named human checked it; `checker` — a proof-checking program verified it; `unconfirmed` (the default) — nobody has, so a proof built on it reads SHOWN, never PROVEN (req:a-design-can-be-a-proof)." }
        confirmed_at: { type: string, description: "WHEN the step was confirmed, as an ISO 8601 timestamp. Absent when unconfirmed." }
        discharges: { type: "list:string", description: "THE ASSUMPTIONS THIS STEP DISCHARGES, by id (req:a-proof-can-discharge-an-assumption-and-generalize-over-a-variable, Anthony 2026-10-17): each names a node some step this one rests on takes as an `assumed` premise (PREMISE_OF with `role: assumed`). A reductio discharges its supposition; an induction step discharges its hypothesis. Once discharged, this step's conclusion no longer rests on the assumption: its truth, its foundations and the what-if read without it, and reasoning_report shows it \"assumed, discharged by\" this step. An assumption that no step discharges is reported (the `reasoning_not_as_stated` gap). Written by add_inference's `discharges`, refused unless the step really rests on it as an assumption. ABSENT MEANS IT DISCHARGES NOTHING; no default." }
        generalizes_over: { type: "list:string", description: "THE VARIABLES THIS STEP GENERALIZES OVER, by name (`L`, `n`) — \"for an arbitrary finite list L\" made checkable (Anthony's choice, 2026-10-17: declared and checked). reflow2 checks that NO premise in the step's chain FIXES one of them: no node the step rests on, at any depth, lists the variable in its `fixes`. AND THAT NO ASSUMPTION STILL OPEN AT THE STEP NAMES ONE (the eigenvariable rule of natural deduction, fixed 2026-10-18 after the Arrow trial certified a generalization over F under an open hypothesis about F): an `assumed` premise beneath the step that neither it nor a step on the way discharges NAMES a variable when its `variables` or its `fixes` lists it, and one that declares no `variables` at all leaves the check unanswerable, so the step does not hold until it declares them (an empty list says it names none). An assumption this same step discharges is closed first: discharge, then generalize, which is how a conditional proof over F ends. A violation makes the step NOT HOLD — its verdict reads `unknown` with the reason, so its conclusion reads unsupported, never refuted. A STRUCTURAL check, not a logic: a variable is the same variable wherever the same name is used, and what the statements say is never read. Written by add_inference's `generalizes_over`. ABSENT MEANS IT GENERALIZES OVER NOTHING." }
        independent_of: { type: "list:string", description: "OTHER STEPS THIS LINE OF REASONING IS STATED INDEPENDENT OF, by id — typically another step concluding the same claim (a second proof). reflow2 CHECKS THE STATEMENT: the two lines may share no step other than those under the lemmas named in `independent_except`; definitions and axioms the lines start from share no step, so they never count against it. A statement the structure does not bear out is reported (the `reasoning_not_as_stated` gap) and read on the step's `independence`. Written by add_inference's `independent_of`. ABSENT MEANS NO SUCH STATEMENT." }
        independent_except: { type: "list:string", description: "THE LEMMAS THE LINES MAY SHARE, by id, when this step is stated independent of others (`independent_of`): a step under one of these — the steps concluding it, and everything they rest on — does not count against the statement. Written by add_inference's `independent_except`. ABSENT MEANS THEY MAY SHARE NO STEP AT ALL." }
        cases: { type: "list:string", description: "THE CASES THIS STEP SPLITS ON, by id: a proof by cases (∨-elimination) names each case's hypothesis — a statement (statement_kind `hypothesis`) that the branch proving the case takes up as an `assumed` premise (req:a-proof-can-state-a-contradiction-cases-suppositions-and-cited-theorems, item 2, Anthony 2026-10-18). The step's premises are each branch's conclusion; it DISCHARGES every case it names, as `discharges` would, and each must be assumed beneath it (add_inference refuses one that is not). A case split holds only when its cases are DECLARED EXHAUSTIVE (`cases_exhaustive`); without it the step does not hold and reads why. Written by add_inference's `cases`. ABSENT MEANS THE STEP SPLITS ON NO CASES." }
        cases_exhaustive: { type: string, node_ref: true, description: "THE RECORD THAT SAYS THE CASES COVER EVERY POSSIBILITY, by id — \"every integer is even or odd\", the major premise of ∨-elimination. reflow2 never judges exhaustiveness: it is the OWNER'S word or a CHECKER'S, and it is read through that record's own computed truth — taken as given (somebody's word, named by its AUTHORED_BY), a passing check (a checker's, through its kept record), or a step concluding it (shown or proven). add_inference draws it as a premise of the step, so losing it reaches the step in a change walk. The step reads `cases.declared` and the record's truth; while it does not hold, neither does the step. Written by add_inference's `cases_exhaustive`, refused unless it names a node of the design. ABSENT MEANS THE CASES ARE NOT DECLARED EXHAUSTIVE." }
      embedding_field: warrant
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 85 }
      discrimination:
        cues:
          - "this follows from those"
          - "it holds because A and B hold"
          - "either one is enough"
          - "two of the three must hold"
        confused_with:
          - type: Decision
            why: >
              A Decision records a CHOICE and why it was made; an Inference records
              that a conclusion FOLLOWS from premises by a rule reflow2 can check. A
              rationale in a Decision's prose is checked by nothing; a step recorded
              as an Inference is read again whenever a premise changes.
          - type: Requirement
            why: >
              DECOMPOSES splits one requirement into children that together are it,
              rolled up by an unwritten AND. An Inference says how premises SUPPORT a
              conclusion and by which rule — all, any one, or k of n — so redundant
              support and a quorum can be said, and checked.
        counter_example: >
          "we chose Postgres because the team already knows it" is NOT an Inference:
          it is a Decision with its rationale. The test is whether a conclusion's
          truth is claimed to follow from other records' truth (Inference), or a
          choice is being explained (Decision).
      # WHAT MATHEMATICS CALLS THIS (req:the-vocabulary-is-served-in-a-fields-own-terms).
      # Served in describe_schema and find_tools, never in tools/list. One term,
      # one home per field; tests/a_fields_own_terms_have_one_home.rs holds the table.
      also_called:
        mathematics:
          - term: inference step
            means: >-
              One step of reasoning, held as an Inference: its premises link in
              (PREMISE_OF), its one conclusion links out (CONCLUDES), and `rule` says
              how the premises combine: all, any one, or k of n. reflow2 checks the
              FORM, whether the premises' computed truth gives the conclusion by that
              rule, and never whether the statements really entail it.
          - term: proof step
            means: >-
              A step of a proof, held as an Inference and read exactly as an inference
              step. That the conclusion follows by form is computed; who confirmed it
              is recorded in `confirmed_by` and `confirmed_how` (person, checker or
              unconfirmed). A proof reads as PROVEN only when every step it rests on
              is confirmed; otherwise it reads as SHOWN (req:a-design-can-be-a-proof).
          - term: inference rule
            means: >-
              Another name for a rule of inference: the rule's name sits in the
              Inference's `rule_name`, a label reflow2 never checks, and the combination
              it does check in `rule` (all, any, k_of_n).
          - term: rule of inference
            means: >-
              The rule a step applies, held on its Inference: the rule's name (modus
              ponens, induction) in `rule_name`, a label reflow2 never checks, and the
              combination reflow2 does check in `rule` (all, any, k_of_n). The rule is
              part of the step, never a record of its own.
          - term: two-column proof
            means: >-
              A proof written as rows of statement | reason. Each row is one Inference:
              the statement is its conclusion, the reason its `rule_name` or `warrant`,
              and the earlier rows it cites are its premises. The whole proof is the
              chain of those Inferences.
          - term: direct proof
            means: >-
              A chain of Inferences from the hypotheses to the statement, each with
              `rule` all and each premise shown or taken. Nothing in it is assumed and
              later discharged; a proof that does assume something marks it `assumed`
              and names the step that discharges it.
          - term: follows from
            means: >-
              "Q follows from P" is one Inference: P its premise (PREMISE_OF), Q its
              conclusion (CONCLUDES), and its `rule` saying how. reflow2 computes
              whether Q follows by that rule from the premises' computed truth, never
              whether P really entails Q.
          - term: modus ponens
            means: >-
              A step with `rule` all and `rule_name` modus ponens: premises P and "P
              implies Q", conclusion Q. reflow2 checks that both premises hold, never
              that Q is what the implication gives.
          - term: proof by induction
            means: >-
              A step with `rule_name` induction and `rule` all: its premises are the
              base case and the inductive step, recorded as a statement of its own
              ("P(k) implies P(k+1)"), and its conclusion is P(n) for all n. Inside the
              inductive step the hypothesis P(k) is an `assumed` premise (add_inference's
              `assumed`) of the steps that use it, and the step concluding "P(k) implies
              P(k+1)" names it in `discharges` and `generalizes_over` k, so no premise
              may fix k.
          - term: mathematical induction
            means: >-
              The same record as a proof by induction: an Inference with `rule_name`
              induction whose premises are the base case and the inductive step ("P(k)
              implies P(k+1)", a statement of its own) and whose conclusion is P(n) for
              all n. The inductive hypothesis P(k) is an `assumed` premise inside the
              inductive step, discharged by the step concluding "P(k) implies P(k+1)".
          - term: contraposition
            means: >-
              A step with `rule_name` contraposition: its premise is "not Q implies not
              P" and its conclusion "P implies Q", each a statement of its own.
          - term: proof by contradiction
            means: >-
              The supposition not-P is a statement of its own (statement_kind
              `hypothesis`), an `assumed` premise (add_inference's `assumed`) of the step
              that derives the contradiction; the contradiction is a statement of its own
              too (statement_kind `falsum`), which reads false; and the step concluding P
              from it names the supposition in `discharges` (a reductio). Assumed, the
              supposition holds inside the argument whatever its own truth, so its falsity
              never fails a step; discharged, P no longer rests on it.
          - term: proof by construction
            means: >-
              A step whose premises are a constructed object and the shown statement
              that it has the property, and whose conclusion is that such an object
              exists.
          - term: proof by exhaustion
            means: >-
              A step with `rule` all whose premises are every case, each shown, and the
              statement that these cases are all the cases, as a premise of its own: the
              one most often left out. Over a finite domain it proves the statement; the
              same cases are only evidence for anything beyond them.
          - term: case analysis
            means: >-
              A proof by cases: each case's hypothesis is a statement (statement_kind
              `hypothesis`) assumed by the branch that proves the conclusion under it;
              the step concluding it from the branches names the hypotheses in `cases`
              (it discharges them) and the record saying they cover every possibility in
              `cases_exhaustive`, the owner's word or a checker's. Without that record
              the step does not hold. Not DECOMPOSES, which rolls delivery up and has no
              place for that statement or for the rule.
          - term: proof by double counting
            means: >-
              A step whose premises are two counts of one set and whose conclusion is
              that the two counts are equal (`rule_name` double counting). Named whole
              on purpose: a cost counted twice in a budget is a mistake, not a proof.
          - term: probabilistic method
            means: >-
              A step whose premise is a shown probability statement (a random object has
              the property with probability above zero) and whose conclusion is that an
              object with the property exists, with certainty.
      extraction_hint: >
        A stated inference step: how some premises support one conclusion, and by
        which rule — all of them, any one, or k of n (a named rule such as modus
        ponens is carried in `rule_name`). Premises link in with PREMISE_OF and the
        one conclusion links out with CONCLUDES; a node concluded by several
        Inferences has alternative derivations and stands while ANY of them holds.
        reflow2 CHECKS THE FORM, NEVER THE CONTENT: from each premise's computed
        truth (a requirement delivered or met, a check passing, a decision
        accepted and live, a constraint not violated, another step's verdict; a
        type with none of these is unknown, never guessed) it computes whether the
        rule holds, and reports a conclusion whose claimed status is past what the
        step supports. Whether the rule was applied correctly to what the
        statements SAY — whether Q really is what P → Q gives from P — is not
        checked here, and a false premise passes the check. Written with
        add_inference.

  edge_types:

    # PREMISE_OF and CONCLUDES are the two links of a stated inference step. They
    # are NOT inference edges in this file's other sense — no `inference_category`
    # — so the extractor never emits them from prose and the impact walk does not
    # read them as causal: they are traceability edges in nodes.rs's table, and
    # the change walk reads them through the step's rule (crate::inference).
    PREMISE_OF:
      # TARGET PINNED, SOURCE DELIBERATELY OPEN: anything a design records can be
      # a premise — a requirement, a check, a decision, a constraint, another
      # step, or a record whose truth reflow2 cannot compute (it reads unknown).
      from: "*"
      to: Inference
      reading: { form: "primitive", primitive: "part-of", sub: "premise", frame: "membership", note: "The premise is one of the grounds the step combines; the rule belongs to the group, not to this link. An `assumed` one is a ground held hypothetically, inside the argument, until a later step discharges it.", modifiers: { role: "modality" }, basis: "classified" }
      properties:
        role: { type: enum, values: [premise, assumed], indexed: true, description: "WHAT THE SOURCE IS TO THE STEP (Anthony's choice, 2026-10-17: discharged assumptions as a premise role). `premise` (the reading when absent): one of the grounds the step combines, read by its computed truth. `assumed`: a HYPOTHESIS the step takes up for the sake of argument — \"suppose the primes are finite\", an induction hypothesis — read as holding inside the argument whatever its own truth, and carried by every conclusion that rests on it until a step DISCHARGES it (`Inference.discharges`). Losing or refuting an assumption never weakens a step that assumes it. Written by add_inference's `assumed`. NO DEFAULT: absent means a premise, as every link written before this did." }
      # WHAT MATHEMATICS CALLS THIS (req:the-vocabulary-is-served-in-a-fields-own-terms).
      # Served in describe_schema and find_tools, never in tools/list. One term,
      # one home per field; tests/a_fields_own_terms_have_one_home.rs holds the table.
      also_called:
        mathematics:
          - term: premise
            means: >-
              The source of a PREMISE_OF edge is a premise of the Inference it points
              to: one of the grounds the step combines by its rule. Written with
              add_inference's `premises`. Under rule all a failing premise fails the
              step and an unknown one leaves it unknown.
      extraction_hint: >
        Source is one of the premises the target Inference combines by its rule.
        A cycle through PREMISE_OF and CONCLUDES is circular reasoning and is
        refused when written. A closed chain of equivalences (A ⇒ B ⇒ C ⇒ A) is
        still a valid proof: record each implication as a statement of its own
        and make it a premise beside its antecedent, so the support stays acyclic.

    CONCLUDES:
      # SOURCE PINNED, TARGET DELIBERATELY OPEN. ONE INFERENCE CONCLUDES EXACTLY
      # ONE NODE: a second CONCLUDES from the same step is refused. A node may be
      # concluded by several Inferences — alternative derivations, read as ANY.
      from: Inference
      to: "*"
      reading: { form: "primitive", primitive: "source-of", sub: "derived", note: "The conclusion comes from the step: it holds when the step's rule holds over its premises, or when another step concluding it does.", basis: "classified" }
      extraction_hint: >
        The source Inference concludes the target: the target holds when the
        step's rule holds over its premises. One step, one conclusion.

    CAUSES:
      from: "*"
      to: "*"
      # SEVERAL RELATIONS UNDER ONE NAME, told apart per edge (measured
      # 2026-09-28). What the edge is named for is a cause, and `causal` and
      # `observed` assert one (with and without a mechanism) — but `basis`
      # defaults to `correlational`, so an edge that never says reads as a
      # correlation; `spurious` and a `refuted` test say NO causal link holds.
      # A rule selecting causes must decide each edge (`edge_reads_as`), never
      # take the type whole.
      reading:
        form: "primitive"
        primitive: "causes"
        polarity: "+"
        modality: "sufficient|necessary"
        modifiers: { basis: "confidence", confidence: "confidence", evidence: "evidence", validation_status: "lifecycle" }
        splits:
          - property: "basis"
            note: "Unset is `correlational`, the schema default: a correlation, not a cause."
            values:
              causal: { form: "primitive", primitive: "causes", polarity: "+", modality: "sufficient|necessary" }
              correlational: { form: "primitive", primitive: "compares", sub: "co-varies", polarity: "+", note: "The two move together; which brings the other about is not claimed." }
              observed: { form: "primitive", primitive: "causes", polarity: "+", note: "Seen to bring the target about, with no mechanism given: a causal claim on weaker grounds than `causal` (Anthony, 2026-09-28). A co-variation is `correlational`." }
              spurious: { form: "primitive", primitive: "causes", negated: true, note: "Judged not to be a causal link at all." }
          - property: "validation_status"
            note: "Applied after `basis`: a test that contradicted the claim overrides what it was asserted on."
            values:
              refuted: { form: "primitive", primitive: "causes", negated: true, note: "A test contradicted the claim." }
        basis: "classified"
      inference_category: causal
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
        basis: { type: enum, values: [observed, correlational, causal, spurious], default: correlational, description: "Correlation-vs-causation rigor (chain_reflow): how strongly the link is grounded. Do not assert `causal` without a mechanism." }
        # The description used to read "(observational / intervention / mechanism
        # / temporal)" — four words, slash-separated, in parentheses, in a file
        # where that shape means "here are the values". None of them is a value.
        # Found 2026-08-08 by calling describe_schema first, as AGENTS.md says
        # to, and being refused. Those four are TESTING METHODS, which belong in
        # `evidence`; the enum is a progress ladder, so it now says so.
        validation_status: { type: enum, values: [unvalidated, hypothesis, validated, refuted], default: unvalidated, description: "How far the causal claim has been tested: `unvalidated` (asserted, never tested), `hypothesis` (stated so it COULD be tested), `validated` (a test supported it), `refuted` (a test contradicted it). How it was tested — observation, intervention, mechanism, timing — belongs in `evidence`." }
      # Folds in enabling (ENABLES retired 2026-07-22, dec:edge-orthogonality):
      # use CAUSES whether the source is sufficient (directly brings about) or
      # necessary (makes possible). The two were the same causal axis and no
      # computation read them apart; `basis`/`evidence` carry the degree.
      extraction_hint: Source brings about or makes target possible — a cause or an enabling condition (event/decision → outcome).

    BLOCKS:
      from: "*"
      to: "*"
      reading: { form: "primitive", primitive: "causes", polarity: "-", modifiers: { confidence: "confidence", evidence: "evidence" }, basis: "classified" }
      inference_category: causal
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
      extraction_hint: Source prevents or stalls target.

    TRIGGERS:
      from: "*"
      to: "*"
      reading: { form: "primitive", primitive: "causes", polarity: "+", modality: "initiating", modifiers: { confidence: "confidence", evidence: "evidence", role: "mechanism" }, basis: "classified" }
      inference_category: causal
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
        # BL-37: in a process model, forward "feeds" and backward "forces a
        # resync" edges are both TRIGGERS — the role is what tells them apart,
        # and it is the entire subject of a model of feedback. Free-form rather
        # than an enum because process roles are domain-specific; flow_report
        # displays it per transition.
        role: { type: string, description: "What this trigger means in its process — e.g. 'feeds', 'forces resync'. Direction of influence, not just causation." }
      extraction_hint: Source is the event/condition that initiates target.

    CONTRADICTS:
      from: "*"
      to: "*"
      reading:
        form: "primitive"
        primitive: "compares"
        polarity: "carried"
        modifiers: { alignment: "polarity", confidence: "confidence", evidence: "evidence", moves_to: "other" }
        splits:
          - property: "alignment"
            note: "Unset is `opposing`, the schema default."
            values:
              opposing: { form: "primitive", primitive: "compares", sub: "conflicts", polarity: "-" }
              supporting: { form: "primitive", primitive: "compares", sub: "corroborates", polarity: "+" }
              conceding: { form: "primitive", primitive: "compares", sub: "concedes", polarity: "+", note: "A reply grants the objection against what it attacks, and moves the argument to the reading named in `moves_to`." }
        basis: "classified"
      inference_category: tension
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
        alignment: { type: enum, values: [opposing, supporting, conceding], default: opposing, description: "opposing = conflict; supporting = corroboration; conceding = the source, a reply, GRANTS the target, an objection, against what that objection attacks, and moves the argument to another reading named in `moves_to` (req:a-reply-can-concede-an-objection-against-one-reading-and-move-to-another): the objection then counts against its target as if it held, while the reply holds. All stored here." }
        moves_to: { type: string, node_ref: true, description: "With `alignment: conceding` only: the reading the argument is meant as instead — usually the step (an Inference) of another reading — by id. Read on the objection as `moves_to`, and on the conceded step's reading." }
      # WHAT MATHEMATICS CALLS THIS (req:the-vocabulary-is-served-in-a-fields-own-terms).
      # Served in describe_schema and find_tools, never in tools/list. One term,
      # one home per field; tests/a_fields_own_terms_have_one_home.rs holds the table.
      also_called:
        mathematics:
          - term: counterexample
            means: >-
              An instance that makes a statement false: the counterexample is the source
              of a CONTRADICTS edge and the statement it breaks is the target, with
              `alignment` left at `opposing` (the default). With `alignment`
              `supporting` the same edge is corroboration, the opposite. An opposing
              CONTRADICTS counts as far as its source HOLDS: a counterexample that holds
              (a passing check, a met requirement) makes the target's computed truth
              `fails`, so every inference step resting on it is reported broken
              (req:a-design-can-be-a-proof); one not yet established leaves the target
              `unknown`, contested; one that fails no longer counts
              (req:a-design-holds-a-line-of-reasoning). The target's own `status` does
              not move — the owner settles that.
          - term: refutes
            means: >-
              A refutes B: A shows B false. Drawn as CONTRADICTS from A to B with
              `alignment` `opposing` (the default); a CONTRADICTS edge marked
              `supporting` corroborates instead. When A holds, B's computed truth is
              `fails` and every step resting on B is reported broken; while A is not
              yet established, B reads `unknown` (contested); once A fails (answered by
              a reply, a CONTRADICTS against A), it no longer counts. B's own `status`
              does not move — its owner settles that. When B is an Inference, A attacks
              the STEP ITSELF — its warrant or rule, not a premise or the conclusion —
              and is read against it: while A holds the step is defeated and supports
              nothing (its conclusion is left unsupported, never refuted), while A stands
              the step is contested, and once A is answered the step is reinstated
              (req:an-objection-aimed-at-a-step-is-read-against-that-step).
      extraction_hint: Two decisions/requirements/claims that conflict (or, with alignment=supporting, reinforce).

    # VALIDATES retired 2026-07-22 (dec:edge-orthogonality): orthogonal-in-name-
    # only with VERIFIES (both Verification→Capability) and orphan — no code read
    # it. The verify-vs-validate distinction moved to Verification.kind, read by
    # the unvalidated_capability gap.

    VIOLATES:
      deliberately_open:
        from: []
        to: [Constraint, DesignRule, Requirement]
      from: "*"
      to: "*"
      reading: { form: "primitive", primitive: "norm", sub: "meets", polarity: "-", modifiers: { confidence: "confidence", evidence: "evidence" }, basis: "classified" }
      inference_category: tension
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
      extraction_hint: Source breaks a Constraint/DesignRule/Requirement target.

    RISKS:
      from: "*"
      to: "*"
      reading: { form: "primitive", primitive: "causes", polarity: "-", modality: "possible", modifiers: { confidence: "confidence", evidence: "evidence", severity: "strength" }, basis: "classified" }
      inference_category: risk
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
        severity: { type: enum, values: [low, medium, high, critical] }
      extraction_hint: Source introduces a risk to target.

    MITIGATES:
      from: "*"
      to: "*"
      reading: { form: "composite", composition: "MITIGATES(m,t) := ∃r: causes(−)(m, r) ∧ causes(−, possible)(r, t)", components: ["causes"], modifiers: { confidence: "confidence", evidence: "evidence" }, basis: "classified" }
      inference_category: risk
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
      extraction_hint: Source reduces a risk affecting target.

    EVOLVES_INTO:
      from: "*"
      to: "*"
      reading: { form: "primitive", primitive: "becomes", sub: "transforms", modifiers: { confidence: "confidence" }, basis: "classified" }
      inference_category: temporal
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
      extraction_hint: Source is an earlier form that becomes target over time.

    OBSOLETES:
      deliberately_open:
        from: [Decision]
        to: []
      from: "*"
      to: "*"
      reading: { form: "primitive", primitive: "norm", sub: "binds", modality: "forbidden", modifiers: { confidence: "confidence" }, basis: "classified" }
      inference_category: temporal
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
      extraction_hint: >
        Source makes target redundant or deprecated — and THIS IS HOW SOMETHING
        IS RETIRED FROM A DESIGN, not a loose editorial relation. Draw it from
        the ACCEPTED Decision that withdrew the thing to the thing itself
        (dec:idea-discontinued-is-a-first-class-state). The decision is the
        source deliberately: a retirement edge normally presumes a SUCCESSOR to
        sit at the source end, and something discontinued with no replacement
        has nothing to put there — but it always has a decision behind it.
        ONLY AN ACCEPTED DECISION DISCONTINUES ANYTHING; a `proposed` withdrawal
        has withdrawn nothing and the target keeps counting until someone with
        the authority says so. IT IS READ, not merely stored — get_node returns
        `discontinued: true` on the target, the unmotivated / unrealized /
        unverified capability gaps fall silent, and delivery stops counting a
        discontinued capability as a satisfier (DeliveryCoverage carries
        `satisfied_only_by_discontinued` so the number never drops unexplained).
        The target's own `status` does NOT move and must not be edited to say
        it: that field records what was BUILT, and this edge records that it is
        gone. Withdrawing what met a need does not meet the need, so the
        requirement it served becomes unsatisfied again and is asked about
        afresh — that cascade is deliberate.

    DUPLICATES:
      from: "*"
      to: "*"
      reading:
        form: "primitive"
        primitive: "compares"
        polarity: "="
        modifiers: { basis: "provenance", confidence: "confidence" }
        splits:
          - property: "basis"
            note: "Unset is `suspected`, the schema default: only a comparison, never a merge."
            values:
              asserted: { form: "primitive", primitive: "same-as", note: "A person says the two cover the same ground; the only basis on which apply_heal merges them." }
              suspected: { form: "primitive", primitive: "compares", polarity: "=", note: "A heuristic suspects it; asked as a possible_duplicate gap, never merged." }
        basis: "classified"
      inference_category: redundancy
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        basis: { type: enum, values: [asserted, suspected], default: suspected, description: "WHO decided these cover the same ground, and therefore whether HEAL may merge them. `asserted` = a human drew this edge, which is the ONLY basis on which apply_heal will delete a node (dec:ask-not-repair). `suspected` = a heuristic proposed it — corpus ingest's fuzzy name match, an extraction pass — and it is asked as a possible_duplicate gap instead. DEFAULTS TO `suspected`, AND ABSENT READS AS `suspected` TOO: merge is irreversible, so an edge that cannot prove somebody meant it does not license a deletion. Legacy edges written before this property existed therefore stop being mergeable until re-asserted, which costs one call; the other default cost dev_storyflow ten proposed node deletions." }
      extraction_hint: Source and target cover the same ground (candidate for consolidation). `basis` says whether a human asserted it or a heuristic suspected it — only `asserted` may be merged.

    ANTICIPATES:
      from: "*"
      to: "*"
      reading: { form: "composite", composition: "ANTICIPATES(x,y) := before(x,y) ∧ about(x,y)", components: ["before", "about"], modifiers: { confidence: "confidence" }, basis: "classified" }
      inference_category: temporal
      pass_1_extractable: true
