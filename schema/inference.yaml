# inference.yaml — the "why" layer.
#
# Edges that capture WHY things relate, not just WHAT connects to WHAT. All use
# wildcard endpoints (from/to "*") so the intelligence layer sits above the
# whole catalog. Adapted from Reflow's inference set and validated against
# storyflow's proven causal edge vocabulary.
#
# Each edge carries `confidence` (0..1) and free-text `evidence` so extraction
# can record how strongly the link is asserted and cite the source text.
#
# Since 2026-10-14 it also holds the STATED INFERENCE STEP — the `Inference`
# node and its two links, PREMISE_OF and CONCLUDES — which say how premises
# support a conclusion by a rule reflow2 checks. Those two links pin one end to
# the step, and they carry no `inference_category` (see below).

schema:
  name: inference
  version: 1

  node_types:

    # A STATED INFERENCE STEP (req:a-design-states-how-premises-support-a-conclusion-and-reflow2-checks-it-follows,
    # shaped by dec:an-inference-is-a-record-between-premises-and-conclusion, both
    # Anthony's, 2026-10-14). A record of its own BETWEEN the premises and the
    # conclusion — his picture's "Operation" box — so its warrant can itself be
    # challenged, verified or go stale. Premises link in (PREMISE_OF), the one
    # conclusion links out (CONCLUDES), and the rule says how they combine.
    #
    # NOT a setting on the conclusion (it could not name a rule or later record
    # who confirmed the step) and NOT one on each link (any one and k of n belong
    # to the group of premises, not to one link). A conclusion with no Inference
    # reads exactly as it always has: delivery still rolls a decomposition up by
    # an unwritten AND. The code is crates/reflow2-core/src/inference.rs.
    Inference:
      properties:
        name: { type: string, indexed: true, fulltext: true, description: "A short handle for the step — what search_design and the reports render. Optional: add_inference composes one from the rule and the conclusion when none is given." }
        rule: { type: enum, values: [all, any, k_of_n], default: all, indexed: true, description: "HOW THE PREMISES SUPPORT THE CONCLUSION, as a combination reflow2 checks over each premise's computed truth — holds, fails or unknown, evaluated three-valued: `all` — every premise must hold (AND: one failing premise fails the step, and with none failing an unknown one leaves it unknown); `any` — one holding premise is enough (OR: redundant support, alternative grounds); `k_of_n` — at least `k` of the premises must hold (a quorum, two-out-of-three voting). `all` is the default and says nothing new: it is the AND delivery has always applied to a decomposition, written down. A NAMED RULE IS CHECKED BY ITS COMBINATION: modus ponens is `all` over P and P → Q, with `rule_name: modus ponens`." }
        k: { type: int, description: "For `k_of_n` only: how many premises must hold. Required with that rule and refused with any other; 1 ≤ k ≤ the number of premises, checked when the step is written with its premises (add_inference). A step whose premises were later removed below k reads `unknown` and says why, never `holds`." }
        rule_name: { type: string, indexed: true, fulltext: true, description: "The rule's name in its own field, free text — `modus ponens`, `induction`, `redundant sensors`, `two-out-of-three voting`. A LABEL, NOT A CHECK: reflow2 checks the step by its `rule` (the combination) and never by this name." }
        warrant: { type: string, fulltext: true, description: "WHY these premises support this conclusion, in the author's words — the part of the step a person can challenge. reflow2 records it and never judges it." }
      embedding_field: warrant
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 85 }
      discrimination:
        cues:
          - "this follows from those"
          - "it holds because A and B hold"
          - "either one is enough"
          - "two of the three must hold"
        confused_with:
          - type: Decision
            why: >
              A Decision records a CHOICE and why it was made; an Inference records
              that a conclusion FOLLOWS from premises by a rule reflow2 can check. A
              rationale in a Decision's prose is checked by nothing; a step recorded
              as an Inference is read again whenever a premise changes.
          - type: Requirement
            why: >
              DECOMPOSES splits one requirement into children that together are it,
              rolled up by an unwritten AND. An Inference says how premises SUPPORT a
              conclusion and by which rule — all, any one, or k of n — so redundant
              support and a quorum can be said, and checked.
        counter_example: >
          "we chose Postgres because the team already knows it" is NOT an Inference:
          it is a Decision with its rationale. The test is whether a conclusion's
          truth is claimed to follow from other records' truth (Inference), or a
          choice is being explained (Decision).
      extraction_hint: >
        A stated inference step: how some premises support one conclusion, and by
        which rule — all of them, any one, or k of n (a named rule such as modus
        ponens is carried in `rule_name`). Premises link in with PREMISE_OF and the
        one conclusion links out with CONCLUDES; a node concluded by several
        Inferences has alternative derivations and stands while ANY of them holds.
        reflow2 CHECKS THE FORM, NEVER THE CONTENT: from each premise's computed
        truth (a requirement delivered or met, a check passing, a decision
        accepted and live, a constraint not violated, another step's verdict; a
        type with none of these is unknown, never guessed) it computes whether the
        rule holds, and reports a conclusion whose claimed status is past what the
        step supports. Whether the rule was applied correctly to what the
        statements SAY — whether Q really is what P → Q gives from P — is not
        checked here, and a false premise passes the check. Written with
        add_inference.

  edge_types:

    # PREMISE_OF and CONCLUDES are the two links of a stated inference step. They
    # are NOT inference edges in this file's other sense — no `inference_category`
    # — so the extractor never emits them from prose and the impact walk does not
    # read them as causal: they are traceability edges in nodes.rs's table, and
    # the change walk reads them through the step's rule (crate::inference).
    PREMISE_OF:
      # TARGET PINNED, SOURCE DELIBERATELY OPEN: anything a design records can be
      # a premise — a requirement, a check, a decision, a constraint, another
      # step, or a record whose truth reflow2 cannot compute (it reads unknown).
      from: "*"
      to: Inference
      reading: { form: "primitive", primitive: "part-of", sub: "premise", frame: "membership", note: "The premise is one of the grounds the step combines; the rule belongs to the group, not to this link.", basis: "classified" }
      extraction_hint: >
        Source is one of the premises the target Inference combines by its rule.
        A cycle through PREMISE_OF and CONCLUDES is circular reasoning and is
        refused when written. A closed chain of equivalences (A ⇒ B ⇒ C ⇒ A) is
        still a valid proof: record each implication as a statement of its own
        and make it a premise beside its antecedent, so the support stays acyclic.

    CONCLUDES:
      # SOURCE PINNED, TARGET DELIBERATELY OPEN. ONE INFERENCE CONCLUDES EXACTLY
      # ONE NODE: a second CONCLUDES from the same step is refused. A node may be
      # concluded by several Inferences — alternative derivations, read as ANY.
      from: Inference
      to: "*"
      reading: { form: "primitive", primitive: "source-of", sub: "derived", note: "The conclusion comes from the step: it holds when the step's rule holds over its premises, or when another step concluding it does.", basis: "classified" }
      extraction_hint: >
        The source Inference concludes the target: the target holds when the
        step's rule holds over its premises. One step, one conclusion.

    CAUSES:
      from: "*"
      to: "*"
      # SEVERAL RELATIONS UNDER ONE NAME, told apart per edge (measured
      # 2026-09-28). What the edge is named for is a cause, and `causal` and
      # `observed` assert one (with and without a mechanism) — but `basis`
      # defaults to `correlational`, so an edge that never says reads as a
      # correlation; `spurious` and a `refuted` test say NO causal link holds.
      # A rule selecting causes must decide each edge (`edge_reads_as`), never
      # take the type whole.
      reading:
        form: "primitive"
        primitive: "causes"
        polarity: "+"
        modality: "sufficient|necessary"
        modifiers: { basis: "confidence", confidence: "confidence", evidence: "evidence", validation_status: "lifecycle" }
        splits:
          - property: "basis"
            note: "Unset is `correlational`, the schema default: a correlation, not a cause."
            values:
              causal: { form: "primitive", primitive: "causes", polarity: "+", modality: "sufficient|necessary" }
              correlational: { form: "primitive", primitive: "compares", sub: "co-varies", polarity: "+", note: "The two move together; which brings the other about is not claimed." }
              observed: { form: "primitive", primitive: "causes", polarity: "+", note: "Seen to bring the target about, with no mechanism given: a causal claim on weaker grounds than `causal` (Anthony, 2026-09-28). A co-variation is `correlational`." }
              spurious: { form: "primitive", primitive: "causes", negated: true, note: "Judged not to be a causal link at all." }
          - property: "validation_status"
            note: "Applied after `basis`: a test that contradicted the claim overrides what it was asserted on."
            values:
              refuted: { form: "primitive", primitive: "causes", negated: true, note: "A test contradicted the claim." }
        basis: "classified"
      inference_category: causal
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
        basis: { type: enum, values: [observed, correlational, causal, spurious], default: correlational, description: "Correlation-vs-causation rigor (chain_reflow): how strongly the link is grounded. Do not assert `causal` without a mechanism." }
        # The description used to read "(observational / intervention / mechanism
        # / temporal)" — four words, slash-separated, in parentheses, in a file
        # where that shape means "here are the values". None of them is a value.
        # Found 2026-08-08 by calling describe_schema first, as AGENTS.md says
        # to, and being refused. Those four are TESTING METHODS, which belong in
        # `evidence`; the enum is a progress ladder, so it now says so.
        validation_status: { type: enum, values: [unvalidated, hypothesis, validated, refuted], default: unvalidated, description: "How far the causal claim has been tested: `unvalidated` (asserted, never tested), `hypothesis` (stated so it COULD be tested), `validated` (a test supported it), `refuted` (a test contradicted it). How it was tested — observation, intervention, mechanism, timing — belongs in `evidence`." }
      # Folds in enabling (ENABLES retired 2026-07-22, dec:edge-orthogonality):
      # use CAUSES whether the source is sufficient (directly brings about) or
      # necessary (makes possible). The two were the same causal axis and no
      # computation read them apart; `basis`/`evidence` carry the degree.
      extraction_hint: Source brings about or makes target possible — a cause or an enabling condition (event/decision → outcome).

    BLOCKS:
      from: "*"
      to: "*"
      reading: { form: "primitive", primitive: "causes", polarity: "-", modifiers: { confidence: "confidence", evidence: "evidence" }, basis: "classified" }
      inference_category: causal
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
      extraction_hint: Source prevents or stalls target.

    TRIGGERS:
      from: "*"
      to: "*"
      reading: { form: "primitive", primitive: "causes", polarity: "+", modality: "initiating", modifiers: { confidence: "confidence", evidence: "evidence", role: "mechanism" }, basis: "classified" }
      inference_category: causal
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
        # BL-37: in a process model, forward "feeds" and backward "forces a
        # resync" edges are both TRIGGERS — the role is what tells them apart,
        # and it is the entire subject of a model of feedback. Free-form rather
        # than an enum because process roles are domain-specific; flow_report
        # displays it per transition.
        role: { type: string, description: "What this trigger means in its process — e.g. 'feeds', 'forces resync'. Direction of influence, not just causation." }
      extraction_hint: Source is the event/condition that initiates target.

    CONTRADICTS:
      from: "*"
      to: "*"
      reading:
        form: "primitive"
        primitive: "compares"
        polarity: "carried"
        modifiers: { alignment: "polarity", confidence: "confidence", evidence: "evidence" }
        splits:
          - property: "alignment"
            note: "Unset is `opposing`, the schema default."
            values:
              opposing: { form: "primitive", primitive: "compares", sub: "conflicts", polarity: "-" }
              supporting: { form: "primitive", primitive: "compares", sub: "corroborates", polarity: "+" }
        basis: "classified"
      inference_category: tension
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
        alignment: { type: enum, values: [opposing, supporting], default: opposing, description: "opposing = conflict; supporting = corroboration. Both stored here." }
      extraction_hint: Two decisions/requirements/claims that conflict (or, with alignment=supporting, reinforce).

    # VALIDATES retired 2026-07-22 (dec:edge-orthogonality): orthogonal-in-name-
    # only with VERIFIES (both Verification→Capability) and orphan — no code read
    # it. The verify-vs-validate distinction moved to Verification.kind, read by
    # the unvalidated_capability gap.

    VIOLATES:
      deliberately_open:
        from: []
        to: [Constraint, DesignRule, Requirement]
      from: "*"
      to: "*"
      reading: { form: "primitive", primitive: "norm", sub: "meets", polarity: "-", modifiers: { confidence: "confidence", evidence: "evidence" }, basis: "classified" }
      inference_category: tension
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
      extraction_hint: Source breaks a Constraint/DesignRule/Requirement target.

    RISKS:
      from: "*"
      to: "*"
      reading: { form: "primitive", primitive: "causes", polarity: "-", modality: "possible", modifiers: { confidence: "confidence", evidence: "evidence", severity: "strength" }, basis: "classified" }
      inference_category: risk
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
        severity: { type: enum, values: [low, medium, high, critical] }
      extraction_hint: Source introduces a risk to target.

    MITIGATES:
      from: "*"
      to: "*"
      reading: { form: "composite", composition: "MITIGATES(m,t) := ∃r: causes(−)(m, r) ∧ causes(−, possible)(r, t)", components: ["causes"], modifiers: { confidence: "confidence", evidence: "evidence" }, basis: "classified" }
      inference_category: risk
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
      extraction_hint: Source reduces a risk affecting target.

    EVOLVES_INTO:
      from: "*"
      to: "*"
      reading: { form: "primitive", primitive: "becomes", sub: "transforms", modifiers: { confidence: "confidence" }, basis: "classified" }
      inference_category: temporal
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
      extraction_hint: Source is an earlier form that becomes target over time.

    OBSOLETES:
      deliberately_open:
        from: [Decision]
        to: []
      from: "*"
      to: "*"
      reading: { form: "primitive", primitive: "norm", sub: "binds", modality: "forbidden", modifiers: { confidence: "confidence" }, basis: "classified" }
      inference_category: temporal
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
      extraction_hint: >
        Source makes target redundant or deprecated — and THIS IS HOW SOMETHING
        IS RETIRED FROM A DESIGN, not a loose editorial relation. Draw it from
        the ACCEPTED Decision that withdrew the thing to the thing itself
        (dec:idea-discontinued-is-a-first-class-state). The decision is the
        source deliberately: a retirement edge normally presumes a SUCCESSOR to
        sit at the source end, and something discontinued with no replacement
        has nothing to put there — but it always has a decision behind it.
        ONLY AN ACCEPTED DECISION DISCONTINUES ANYTHING; a `proposed` withdrawal
        has withdrawn nothing and the target keeps counting until someone with
        the authority says so. IT IS READ, not merely stored — get_node returns
        `discontinued: true` on the target, the unmotivated / unrealized /
        unverified capability gaps fall silent, and delivery stops counting a
        discontinued capability as a satisfier (DeliveryCoverage carries
        `satisfied_only_by_discontinued` so the number never drops unexplained).
        The target's own `status` does NOT move and must not be edited to say
        it: that field records what was BUILT, and this edge records that it is
        gone. Withdrawing what met a need does not meet the need, so the
        requirement it served becomes unsatisfied again and is asked about
        afresh — that cascade is deliberate.

    DUPLICATES:
      from: "*"
      to: "*"
      reading:
        form: "primitive"
        primitive: "compares"
        polarity: "="
        modifiers: { basis: "provenance", confidence: "confidence" }
        splits:
          - property: "basis"
            note: "Unset is `suspected`, the schema default: only a comparison, never a merge."
            values:
              asserted: { form: "primitive", primitive: "same-as", note: "A person says the two cover the same ground; the only basis on which apply_heal merges them." }
              suspected: { form: "primitive", primitive: "compares", polarity: "=", note: "A heuristic suspects it; asked as a possible_duplicate gap, never merged." }
        basis: "classified"
      inference_category: redundancy
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        basis: { type: enum, values: [asserted, suspected], default: suspected, description: "WHO decided these cover the same ground, and therefore whether HEAL may merge them. `asserted` = a human drew this edge, which is the ONLY basis on which apply_heal will delete a node (dec:ask-not-repair). `suspected` = a heuristic proposed it — corpus ingest's fuzzy name match, an extraction pass — and it is asked as a possible_duplicate gap instead. DEFAULTS TO `suspected`, AND ABSENT READS AS `suspected` TOO: merge is irreversible, so an edge that cannot prove somebody meant it does not license a deletion. Legacy edges written before this property existed therefore stop being mergeable until re-asserted, which costs one call; the other default cost dev_storyflow ten proposed node deletions." }
      extraction_hint: Source and target cover the same ground (candidate for consolidation). `basis` says whether a human asserted it or a heuristic suspected it — only `asserted` may be merged.

    ANTICIPATES:
      from: "*"
      to: "*"
      reading: { form: "composite", composition: "ANTICIPATES(x,y) := before(x,y) ∧ about(x,y)", components: ["before", "about"], modifiers: { confidence: "confidence" }, basis: "classified" }
      inference_category: temporal
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
      extraction_hint: Source plans for or foreshadows a future target need.

    MASKS:
      from: "*"
      to: "*"
      reading: { form: "composite", composition: "MASKS(x,y) := causes(−)(x, about(o, y)) — x prevents an observer o knowing y's problem or property", components: ["causes", "about"], modifiers: { confidence: "confidence", evidence: "evidence" }, basis: "classified" }
      inference_category: risk
      pass_1_extractable: true
      properties:
        confidence: { type: float, range: [0.0, 1.0] }
        evidence: { type: string }
      extraction_hint: Source hides a problem or property of target (e.g. a workaround masking a defect).
