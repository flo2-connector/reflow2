[package]
name = "reflow2-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reflow 2.0 agent-native surface — an MCP stdio server exposing the coherence-loop ops as tools"
# The files in tests/ are compiled into the few test PROGRAMS declared at the
# end of this file, not one program each. See the note there.
autotests = false

[[bin]]
name = "reflow2-mcp"
path = "src/main.rs"

[features]
# ON-DISK STORAGE — a design store in a folder, through RocksDB — is ON BY
# DEFAULT, because the design must survive across agent sessions
# (surface-plan.md, repo-file shape). Every build anyone installs or runs has
# it: a release (release.yml), `cargo install`, the Docker images
# (docker/build.sh), the installer's source-build line and the launcher all
# build with default features. It pulls the librocksdb-sys C++ compile.
#
# WITHOUT IT (`--no-default-features`, the everyday `cargo dev-test`) this
# crate builds and tests on the in-memory backend and never compiles RocksDB
# (Anthony, 2026-10-15: "for the vast majority of development, I don't think
# it's necessary"). Every path that would open a store in a folder then
# REFUSES, naming this feature and the fix, and never falls back to memory
# (`opening::refuse_without_on_disk_storage`). It was turned on by the
# dependency line below until then, which `--no-default-features` cannot
# switch off.
default = ["rocksdb"]
rocksdb = ["reflow2-core/rocksdb"]

[dependencies]
# The deterministic core. `fulltext` (BM25 search through Tantivy, pure Rust)
# is on in both builds: search works on the in-memory backend too, and it is
# about 3 MB of the server's 61 MB of code. On-disk storage comes through this
# crate's own `rocksdb` feature above, not this line.
reflow2-core = { path = "../reflow2-core", features = ["fulltext"] }

# Official Rust MCP SDK. `server`+`macros` give the #[tool]/#[tool_router]
# surface; `transport-io` gives the stdio transport grok build / claude code
# connect over; `schemars` generates the tool-input JSON schemas.
rmcp = { version = "3.5", features = ["server", "client", "macros", "transport-io", "schemars", "transport-streamable-http-server"] }
# One server, many client sessions (req:sessions-share-a-graph). rmcp hands us a
# tower Service; hyper-util runs it. Deliberately NOT axum: routing, extractors
# and middleware are all things we would not use, and every consumer pays the
# compile.
# `client` as well as `server`: in shared mode this binary is BOTH — the daemon
# serves, and every session process is a client of it (src/proxy.rs). Same hyper,
# no second HTTP stack, and no new crate in the tree — `http-body-util`, `http`
# and `bytes` were already here transitively and are now named because we use
# them directly.
# `base64` was declared here 2026-08 for binary content travelling over MCP and
# never called — zero use sites when checked 2026-09-15 — so it was removed
# rather than bumped: per dec:design-dependencies-declared a declared reliance
# must be a real one, and a crate nothing calls is a decaying claim. Declare it
# again the day the first call site lands.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "service"] }
http-body-util = "0.1"
bytes = "1"
# `/g/<graph_id>/` routing (src/registry_http.rs) is a hyper/tower Service this
# crate writes itself — the "deliberately NOT axum" note above is what makes
# these three direct rather than borrowed: rmcp's own Service impl is stated in
# `http` types, its response body in `http-body`, and the trait it implements is
# `tower-service`. All three were already in the tree transitively, so naming
# them adds no crate, and per dec:design-dependencies-declared a reliance is
# recorded rather than implied.
http = "1"
http-body = "1"
tower-service = "0.3"
# HTTPS for `--remote` ONLY (src/mcp_http.rs), added 2026-09-26 for
# req:a-local-client-works-against-a-remote-reflow2-server-by-url, option (a)
# settled by Anthony: the same binary reaches a remote reflow2 (api.flo2.io, or
# an organization's shared server) over TLS, while local mode stays plain
# loopback HTTP with no network at all (req:reflow2-keeps-working-entirely-on-
# one-machine). `ring`, not the default aws-lc-rs, so the build needs no cmake;
# the OPERATING SYSTEM's trust store, not a bundled one, so a company server
# with an internally issued certificate is trusted the same way the machine
# trusts it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
# OAuth 2.0 RESOURCE SERVER (src/bearer.rs), added 2026-10-01 for #616 fix 4
# under req:every-oauth-role-reflow2-plays-meets-oauth-2-1-at-a-minimum: an
# exposed --http engine verifies Bearer JWTs itself (dec:idea-authentication-is-
# somebody-elses-layer-and-the-line-is-the-contributor-id, option (e)).
# · `jsonwebtoken` parses the JWS, the JWKs and the claims, and validates
#   iss/aud/exp/nbf — the parts where token bugs live, kept in the most used,
#   maintained Rust JWT crate rather than hand-rolled here. DEFAULT FEATURES
#   OFF and NEITHER of its crypto backends: `aws_lc_rs` is a second C crypto
#   build, and `rust_crypto` brings the `rsa` crate (RUSTSEC-2023-0071, no
#   fixed release). Instead `ring` — the crypto this binary's TLS already
#   runs on — is plugged in as its provider, verification only (bearer.rs).
#   Net new crates in the tree: jsonwebtoken and signature.
# · `ring` and `base64` were already in the tree (rustls; jsonwebtoken) and are
#   named now because bearer.rs calls them (dec:design-dependencies-declared).
jsonwebtoken = { version = "11", default-features = false }
ring = "0.17"
base64 = "0.23"
# `reflow2-mcp setup` (req:one-setup-command-chooses-local-or-remote-once):
# the remote server's key is kept in the OS KEYCHAIN — macOS Keychain, the
# Windows Credential Manager, the desktop Secret Service on Linux (the
# pure-Rust zbus backend, so no system library is needed to build). keyring's
# `v1` mode has NO in-memory fallback: with no keychain it errors, and setup
# says so, rather than "storing" a key that is gone when the process exits.
keyring = "4"
# The key is typed at a prompt that does not echo it, never on the command line.
rpassword = "7"

# `signal` so a shared server can remove its rendezvous on SIGTERM instead of
# leaving a record pointing at a dead port; `process` so a session can spawn one.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "net", "signal", "process", "time"] }
serde = { version = "1", features = ["derive"] }
# `.reflow2.toml` (src/pointer.rs): a code folder names the design it
# implements. A real TOML parser rather than a hand-rolled subset, because the
# file is written by people; `deny_unknown_fields` then refuses anything that
# is not a pointer, a key in particular. Added 2026-09-28 with its first call
# site (req:a-code-folder-names-the-design-it-implements-and-its-server).
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
serde_json = "1"
schemars = "1"
# `sha2` was removed 2026-09-15 as unused and RETURNED 2026-09-18 for one use
# site: `measure.rs` streams a registered file through it so a checksum can be
# MEASURED by the server rather than pasted by a caller. The file read lives in
# this crate on purpose — reflow2-core still reads no file.
sha2 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# A spawned shared daemon keeps nothing of the process that started it
# (`shared::detach`): `setsid`, `close_range(2)` and `fcntl` in the child
# before exec, none of which `std` exposes. Already in the tree through tokio,
# and named because shared.rs now calls it (dec:design-dependencies-declared).
# Called from Unix code only; the crate builds on every platform.
libc = "0.2"

# For iterating against the local rmcp checkout instead of crates.io, uncomment.
# `rust-sdk` IS rmcp — the repo publishes the crate; they are not two things.
# A [patch] section is only honoured in the WORKSPACE root Cargo.toml, so put it
# there rather than here if this ever gets used in anger. Do not commit it
# uncommented: the local checkout tracks rmcp v3 betas while this workspace pins
# v2, and a silent major-version swap would change the whole tool surface.
# [patch.crates-io]
# rmcp = { path = "/home/ajs7/project/rust-sdk/crates/rmcp" }

[dev-dependencies]
tempfile = "3"

# ── Test programs ──────────────────────────────────────────────────────────
#
# THE ~170 FILES IN tests/ ARE COMPILED INTO THESE FEW PROGRAMS, not one program
# each (2026-10-15). One per file made ~170 programs of ~390 MB each in a debug
# build, every one linking the whole crate and its dependencies again, and
# cargo keeps every old copy. Each file stays where it was — the design's
# artifacts and checks, the docs and the links name these paths — and is a
# module of one program's root, so its tests are named `<file>::<test>`:
#
#     cargo test -p reflow2-mcp --test in_memory <file>::
#
# A FILE IN NO PROGRAM COMPILES NOWHERE AND RUNS NOWHERE, now that discovery is
# off: declare a new file in tests/in_memory.rs, or tests/on_disk.rs if it
# opens a store in a folder. `every_test_file_runs_in_exactly_one_program`
# fails until it is.

# Every test that needs no store in a folder. Builds without RocksDB.
[[test]]
name = "in_memory"
path = "tests/in_memory.rs"

# Every test that opens a design store in a folder, so it needs on-disk
# storage: skipped whole by `--no-default-features` and `cargo dev-test`, run
# by `cargo test -p reflow2-mcp`, `cargo full-test` and CI's full job.
[[test]]
name = "on_disk"
path = "tests/on_disk.rs"
required-features = ["rocksdb"]

# ⚠️ ITS OWN PROCESS. `declare_serving_many_sessions` is a one-way,
# process-wide latch: once set, a seat this process handed out reads
# `unknown` rather than `live`. Sharing a process would flip it under every
# other test that asks claim_report about a seat (tools.rs does).
[[test]]
name = "mint_seat_liveness"
path = "tests/mint_seat_liveness.rs"

# ⚠️ ITS OWN PROCESS. It sets REFLOW2_CONFIG_DIR for the whole process
# (`std::env::set_var`, unsafe since edition 2024 because another thread may be
# reading the environment), so the settings and keychain of whoever runs the
# suite are never read. In a shared process every other test would run under
# that variable, set from another thread while it might be reading it.
[[test]]
name = "a_design_is_watched_at_the_server_that_holds_it"
path = "tests/a_design_is_watched_at_the_server_that_holds_it.rs"
