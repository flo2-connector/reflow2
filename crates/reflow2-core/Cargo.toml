[package]
name = "reflow2-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reflow 2.0 deterministic core — a schema-driven design graph, foundation included"
# The files in tests/ are compiled into the few test PROGRAMS declared at the
# end of this file, not one program each. See the note there.
autotests = false

[dependencies]
rmp-serde = { workspace = true }
tracing = { workspace = true }
lru = { workspace = true }
serde_yaml_ng = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
rocksdb = { workspace = true, optional = true }
tantivy = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
# Snapshots store a node's property bag as a JSON string (temporal.yaml's
# `Snapshot.state`); `Value` is serde-serializable (untagged), so this renders
# clean JSON rather than an opaque debug blob.
serde_json = "1"
# The export's content hash (tamper evidence + lineage chain,
# dec:export-hash-chain). FNV-1a serves the deterministic *ids*; a fingerprint
# meant to detect edits needs a real cryptographic hash.
sha2 = "0.11"

[features]
default = []
# On-disk persistence via the foundation's RocksDB backend. Off by default so
# the librocksdb-sys C++ compile stays opt-in; the in-memory backend needs no
# feature. When off, `DesignGraph::open_rocksdb` fails loud (foundation
# contract), rather than silently falling back to memory.
rocksdb = ["dep:rocksdb"]
# BM25 full-text search over the schema's `fulltext:` properties (Tantivy via
# dynograph-text — pure Rust, no C++, but a real dependency tree, so it stays
# off the sub-second core iteration path). The engine mirrors node writes into
# the index automatically; the schema has carried the `fulltext:` flags since
# it was written. When off, `DesignGraph::search_design` fails loud rather
# than silently returning nothing.
fulltext = ["dep:tantivy"]

[dev-dependencies]
# Absorbed with dynograph-storage: keys.rs carries proptest round-trip tests
# and the engine tests write to real temp dirs.
proptest = "1"
tempfile = "3"
# The guard test (`every_test_file_runs_in_exactly_one_program`) reads this
# file's `[[test]]` targets.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

# ── Test programs ──────────────────────────────────────────────────────────
#
# THE ~225 FILES IN tests/ ARE COMPILED INTO THESE FEW PROGRAMS, not one program
# each (2026-10-15). One per file made ~225 programs of ~22 MB each in a debug
# build (no features), every one linking the whole crate and its dependencies
# again, and cargo keeps every old copy. Each file stays where it was — the
# design's artifacts and checks, the docs and the links name these paths — and
# is a module of one program's root, so its tests are named `<file>::<test>`:
#
#     cargo test -p reflow2-core --test in_memory <file>::
#
# A FILE IN NO PROGRAM COMPILES NOWHERE AND RUNS NOWHERE, now that discovery is
# off: declare a new file in tests/in_memory.rs, or in the feature-gated
# program if the whole file needs that feature.
# `every_test_file_runs_in_exactly_one_program` fails until it is.

# Every test that needs no whole-file feature gate. Builds with whatever
# features the user passes; per-test `#[cfg(feature = "...")]` gates inside
# each file handle both configurations.
[[test]]
name = "in_memory"
path = "tests/in_memory.rs"

# Every test whose WHOLE FILE is gated on `rocksdb`: skipped by
# `--no-default-features` and `cargo dev-test`, run by `cargo full-test` and
# CI's full job.
[[test]]
name = "on_disk"
path = "tests/every_open_store_shares_one_memory_budget.rs"
required-features = ["rocksdb"]

# Every test whose WHOLE FILE is gated on both `rocksdb` and `fulltext`.
[[test]]
name = "on_disk_fulltext"
path = "tests/a_store_opened_without_its_search_index_rebuilds_it.rs"
required-features = ["rocksdb", "fulltext"]

# ⚠️ ITS OWN PROCESS. It compares the FIRST `DesignGraph::open_in_memory()`
# in a process against a warm one: the schema's `LazyLock` must not have been
# triggered yet. In a shared process, any other test that opens a graph warms
# the cache first, and the cold/warm ratio collapses.
[[test]]
name = "the_schema_is_parsed_once"
path = "tests/the_schema_is_parsed_once.rs"
