# reflow2's site: site/ published to GitHub Pages (flo2-connector.github.io/reflow2).
#
# AN ACTIONS DEPLOY, NOT A BRANCH OR /docs, because the repository root is a Rust
# workspace and req:reflow2-has-a-public-page-anyone-can-read asked for the HTML to
# stay out of it. Only site/ is uploaded, as committed. Until 2026-10-30 one file
# was made here, site/counts.json, reflow2's own design counted at each release
# tag; the design is hosted on flo2.io and private now, its committed copy
# retired, and the counts with it, so the site claims no numbers it cannot read.
#
# The repository's Pages source must be "GitHub Actions" (Settings -> Pages) for the
# deploy step to have a site to publish to.
#
# ⭐ MAIN IS THE ONLY REF THAT PUBLISHES, ON PURPOSE. The `github-pages` environment
# admits deployments from `main` alone, and stays that way. So a release tag never
# runs this: #741 tried (`tags: ["v*"]`), and v0.84.0's tag run 38555276998 was
# refused with "Tag "v0.84.0" is not allowed to deploy to github-pages due to
# environment protection rules." Instead release.yml's last job, `site`, dispatches
# this workflow ON MAIN once the release is published, so the site goes out as
# main stands after the release. (Until 2026-10-30 that run also counted the
# release just cut, which main's own run at the merge could miss.)
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # Also how each release republishes the site: release.yml dispatches this on main
  # after publishing (`gh workflow run pages.yml --ref main`), so the site that goes
  # out is main's as of the release just cut. Never add a tag trigger: see the header.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
