# CI — the done-gates from AGENTS.md, enforced on every push instead of on
# every agent remembering. Two jobs by cost:
#
# - `core` needs no RocksDB: the core crate's fast path (in-memory backend),
#   fmt/clippy, the schema validator, the installer suite, and the skill lint.
#   Feedback in a couple of minutes.
# - `full` pays the RocksDB C++ compile once (then rust-cache carries it): the
#   whole workspace including the MCP surface, then the instruments that drive
#   the REAL binary over stdio — smoke_mcp (the only layer that catches what
#   three agreeing home-grown clients once all missed), phase_trial (13/13,
#   explicitly a regression gate), model_the_loop and coherent_erosion_trial
#   (exit non-zero on regression). erosion_trial is deliberately absent: it
#   exits non-zero BY DESIGN until the ledger-judgement decision changes.
#
# ubuntu-22.04 to match release.yml, not -latest.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core gates (no RocksDB)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The export-lineage guard (BL-107) compares HEAD against HEAD~1, and
          # checkout defaults to depth 1 — so `git show HEAD~1:...` failed, the
          # check treated the question as unanswerable and SKIPPED, and it has
          # therefore never once run in CI. Depth 2 is exactly what it needs
          # (BL-208).
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-core
      - name: Core tests (in-memory backend)
        run: cargo test -p reflow2-core --no-default-features --no-fail-fast
      - name: Clippy (core)
        run: cargo clippy -p reflow2-core --no-default-features --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --check
      - name: Schema validates
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/validate_schema.py
      - name: Discrimination rules agree with capture-intent's routing table
        # flo2 F24: the schema served the TYPES and not the rules that tell them
        # apart, so a consumer building an extraction prompt from it could not
        # choose correctly — and a numeric prohibition was filed as a Requirement
        # on a live site. The rules now live in the schema per type, which puts
        # the SAME contract in two places: here as data, and in capture-intent's
        # markdown table as prose for an agent. This keeps them one contract, the
        # way skill_lint already does for AGENTS.md and this file.
        run: python3 tools/check_discrimination_rules.py
      - name: Installer suite (hermetic)
        run: python3 tools/test_init.py
      - name: Loop-nudge hook suite (hermetic)
        run: python3 tools/test_loop_nudge.py
      - name: OpenCode loop-nudge plugin
        run: python3 tools/test_opencode_plugin.py
      - name: View-renderer suite (hermetic, file-form — no binary)
        run: python3 tools/test_render_views.py
      - name: Skill lint (skills' contract with the surface, and AGENTS.md's gate list vs this file)
        run: python3 tools/skill_lint.py
      - name: Skill-lint suite (hermetic — the gate cross-check's own net, BL-159)
        run: python3 tools/test_skill_lint.py
      - name: Gate-runner suite (hermetic — the runner must never pass having run nothing)
        # tools/run_ci_gates.py executes the list ci.yml defines, reading it
        # through skill_lint's parser rather than restating it. Its own failure
        # mode is the one it exists to end: a first draft exited 0 on a filter
        # that matched nothing and never returned a non-zero code at all.
        run: python3 tools/test_run_ci_gates.py
      - name: Wall-check suite (hermetic — the declared decomposition vs the real source)
        run: python3 tools/test_wall_check.py
      - name: A real test run reaches the design by file (the run-to-files converter's own net)
        run: python3 tools/test_run_to_files.py
      - name: The launcher serves a release binary and builds nothing there
        run: python3 tools/launch_serves_release.py
      - name: CHANGELOG fragments are well formed, and nobody wrote into [Unreleased] directly
        # One fragment per PR in changelog.d/, assembled at the cut
        # (dec:idea-how-changelog-md-gets-written-once-the-design-is-the-record).
        run: python3 tools/changelog_fragments.py --check
      - name: CHANGELOG fragment suite (hermetic — the cut assembles and removes them; two PRs' fragments merge in either order)
        run: python3 tools/test_changelog_fragments.py
      - name: Doc-version drift (prose vs what the build actually pins)
        run: python3 tools/check_doc_versions.py
      - name: skills-and-tools.md matches the served surface
        run: python3 tools/render_skills_and_tools.py --check
      - name: Doc-version checker suite (hermetic)
        run: python3 tools/test_check_doc_versions.py
      - name: Release workflow shape (hermetic — arm64 built natively, each image smoked before any push, both platforms in one index, a dry run writes nothing)
        # release.yml runs on a tag, so a tag used to be the first thing to test
        # it. This reads its jobs and drives the scripts they call
        # (docker/publish-index.sh, docker/image-release-notes.sh,
        # tools/install.sh) against stand-ins — GitHub issue #617. Needs the
        # PyYAML the schema step above installs.
        run: python3 tools/test_release_workflow.py
      - name: Dependency-currency checker suite (hermetic — behind with no hold fails, in-range is reported, the floor is stable minus one)
        # The checker the `dependencies` workflow runs monthly and before every
        # cut. Its verdicts are pinned here on every push, against a fixture
        # tree and a fake upstream, so a regression shows up the day it is
        # written instead of the first of the month. tomli: this runner's Python
        # is 3.10, which has no tomllib.
        run: |
          python3 -m pip install --quiet tomli
          python3 tools/test_dependency_currency.py

  full:
    name: workspace + real-binary instruments
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # 🛑 C AND C++ DEPENDENCIES BUILD WITHOUT DEBUG INFO IN THIS JOB. Measured
    # 2026-10-02 on #652 (rocksdb 0.24 → 0.25): the job died of "No space left on
    # device" after "Workspace tests (both crates)" PASSED — the second time,
    # after #593. librocksdb.a is 1.04 GB at RocksDB 11.8.1 (0.89 GB at 10.4.2),
    # and 54% of it is DWARF debug info, against 24 MB of machine code; every
    # test executable that links RocksDB carries its share, and the workspace
    # has 331 test files. #651's runner had 105 GB free after the cleanup step,
    # and a 17% bigger RocksDB, multiplied by every test binary, tipped it.
    # -g0 drops the C/C++ debug info only (cc appends CFLAGS/CXXFLAGS after its
    # own -g); Rust's own debug info is untouched, so panics and backtraces read
    # as before. THE STEP AFTER THE TESTS REPORTS THE MARGIN on every run, so the
    # next growth shows up as a number long before it is a crash.
    env:
      CFLAGS: -g0
      CXXFLAGS: -g0
    steps:
      - uses: actions/checkout@v7
        with:
          # Same reason as the core job: the lineage guard runs in THIS job and
          # needs HEAD~1 to exist (BL-208).
          fetch-depth: 2
      # ⚠️ THE RUNNER'S DISK HOLDS ONE RocksDB BUILD, NOT TWO. Measured
      # 2026-09-26 (#593): adding `keyring` turned on syn's `fold` feature, which
      # RocksDB's bindgen build also uses, so librocksdb-sys rebuilt. The cache
      # restored main's build as well, and Clippy's step failed on "No space
      # left on device" with every test green. Any dependency that moves a
      # shared build crate does this again, so make the room first: these
      # preinstalled toolchains are never used by this job.
      - name: Free disk space (room for a second RocksDB build)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-full
      - name: Workspace tests (both crates)
        run: cargo test --workspace --no-fail-fast
      - name: Disk after the tests (the margin #593 and #652 ran out of)
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true
          for a in target/debug/build/librocksdb-sys-*/out/librocksdb.a; do [ -f "$a" ] && ls -la "$a"; done
          avail=$(df --output=avail -B1G / | tail -1 | tr -d ' ')
          echo "free after the workspace tests: ${avail} GB"
          if [ "$avail" -lt 20 ]; then
            echo "::warning::only ${avail} GB free after the workspace tests; this job's disk is close to the edge (#593, #652)"
          fi
      - name: Clippy (mcp)
        run: cargo clippy -p reflow2-mcp --all-targets -- -D warnings
      - name: Build the served binary
        run: cargo build -p reflow2-mcp
      - name: Design coherence gate (reflow2 on itself — self-model matches the build)
        # reflow2's own consumer CI gate (BL-66), run on reflow2's own committed
        # self-model: re-hashes registered artifacts, reconciles, detect_gaps.
        # Fails the build on unaccepted drift (a code change that didn't reconcile
        # the design) or a serious open gap. MUST live in this job, not core: it
        # spawns the reflow2-mcp binary (built just above), which the no-RocksDB
        # core job does not build — placed there it FileNotFounded on every push,
        # so the gate silently never ran in CI (found cutting v0.10.0).
        run: python3 tools/reflow2_check.py --export docs/design/reflow2/
      - name: Coherence-gate suite (hermetic — the gate's own regression net, BL-88)
        run: python3 tools/test_reflow2_check.py
      - name: The server and the CI gate give one answer about every artifact location (real binary)
        run: python3 tools/test_one_meaning_for_an_artifact_location.py
      - name: A git diff is read as a design change, and an unmapped file is reported loudly (hermetic)
        run: python3 tools/test_impact_of_diff.py
      - name: A git history is read as the why skill's agenda — grouped, noise dropped by rule, coverage from the design (hermetic)
        run: python3 tools/test_why_history.py
      - name: The latent server promotes itself on any MCP client (real binary over stdio)
        run: python3 tools/test_latent_promotion.py
      - name: A reply takes the shape its client can read (per-client content policy, on the wire)
        run: python3 tools/test_content_policy.py
      - name: Declared vocabulary stays reachable from the surface
        # THE HALF THAT MAKES THE INSTRUMENT MATTER. tools/vocabulary_reach.py
        # existed for weeks and was invoked by no workflow step, no gate script
        # and no build target, so it ran only when somebody remembered it — and
        # a correct instrument nobody runs catches nothing. Found 2026-09-07
        # while root-causing two unreachable properties a USER reported:
        # `fact:the-reachability-instrument-is-wired-into-no-gate-so-its-filter-was-never-the-only-cause`.
        #
        # A REGRESSION GATE, NOT A CLEANLINESS GATE: it fails when a property
        # becomes unreachable that the committed baseline does not already
        # carry, and the 48 known ones are grandfathered rather than approved.
        # Same shape as the intent-authority gate. A gate that goes red on day
        # one over a long-standing state is a gate somebody switches off.
        run: python3 tools/vocabulary_reach.py --check
      - name: Reachability instrument's own regression net
        run: python3 tools/test_vocabulary_reach.py
      - name: Self-host still exercises DOCUMENTS (BL-199 — the canary for BL-176)
        # Guards the RECORD, not the code. reflow2 attached 32 of its 35 document
        # artifacts with REALIZES, against its own served skill, so it never did
        # the thing that fires BL-176 and could not find that bug on itself for
        # eleven releases. This fails if the design record drifts back to
        # REALIZES-only and silently loses the ability to catch that regression.
        run: python3 tools/self_host_uses_documents.py docs/design/reflow2/
      - name: Design intent moves only on the owner's word
        # The one ENFORCED rule this project has that actually enforces. Anthony
        # marked it gate-blocking on 2026-08-09 ("stop the build") and nothing
        # checked it for twelve days, because an honest check would have gone red
        # against 57% of the settled design on the day it landed. His answer was
        # to grandfather: guard what is settled from here, do not reopen what
        # came before. The boundary lives in the graph on
        # dec:the-authority-check-guards-forward-not-backward, not in the script,
        # so silencing a finding means editing the design where a review sees it.
        run: python3 tools/check_intent_authority.py docs/design/reflow2/
      - name: Intent-authority suite (hermetic — it must never pass quietly)
        run: python3 tools/test_check_intent_authority.py
      - name: A capability that claims reach beyond this repo is realized by something a consumer gets
        # The wall check was built here, generalised in code to "any project", and reached
        # a consumer through nothing — this checkout has the script, so it could not feel
        # the absence. The gate reads the export; the class is "realized only by tools/".
        run: python3 tools/check_consumer_reach.py docs/design/reflow2/
      - name: Consumer-reach gate suite
        run: python3 tools/test_check_consumer_reach.py
      - name: A capability does not NEWLY claim a check nothing can re-run
        # Measured 2026-09-22: 241 of 291 capabilities read "verified" and 21 of
        # those had a check anything IMPLEMENTS. The tests were real; the record
        # of them was not. The 220 already in that state are grandfathered by id
        # on dec:a-capability-may-not-newly-reach-verified-on-a-claim-alone and
        # the set may only shrink — a SET and not a count, because a count stays
        # still while one claim is earned and another is introduced.
        run: python3 tools/check_verification_ratchet.py docs/design/reflow2/
      - name: Verification-ratchet suite (hermetic — it must never pass quietly)
        run: python3 tools/test_check_verification_ratchet.py
      - name: Command surface agrees with itself
        # reflow2's own surface lives in several places — three skill dirs, a
        # command source and its copy, and an alias table in Rust — and until
        # 2026-09-01 nothing compared them. Two had already drifted: four
        # commands existed only in this repo, and the alias table was missing
        # three of eleven, which reproduced the exact 2026-08-19 failure that
        # table was written to fix. Verified to FAIL on all three drift shapes
        # before being wired here, not merely to pass on a clean tree.
        run: python3 tools/check_command_surface.py
      - name: Nothing reflow2 serves names a real person from its own design
        # Anthony asked 2026-09-20 whether he was turning up in other people's
        # reflow2 projects by default. The shipped kit contains his id zero
        # times and the server never invents a Contributor — and the binary
        # carried `who:ajs` in four served places anyway, the worst being the
        # only worked example on add_contributor's `id`, which is what an agent
        # reads at the moment it invents one. The gate also caught a second
        # person's first name in two schema files and two skill bodies.
        run: python3 tools/the_served_surface_names_no_real_person.py
      - name: The item layout merges under git's ordinary merge (real binary, real branches, no driver)
        # req:the-saved-design-merges-correctly-under-gits-ordinary-merge: two PRs'
        # records and fragments merge in either order, the merge equals a
        # sequential replay, lineage stays one hop through a mid-merge export.
        run: python3 tools/test_item_layout_merges.py
      - name: Merge-driver suite (real git branches, not a home-grown client)
        # Git is the client this contract is with, so git runs the test: two
        # branches editing different parts of one export must merge with no
        # human, and a both-sides conflict must leave the path unmerged.
        run: python3 tools/test_merge_driver.py
      - name: Shared-sessions suite (one server, several client sessions, one design)
        # req:sessions-share-a-graph / req:seat-per-client: the store is
        # single-writer PER PROCESS, so one server with many sessions is the
        # answer rather than a worktree each. Real HTTP, real concurrent
        # clients — the seat bug this guards would have been silent.
        run: python3 tools/test_shared_sessions.py
      - name: --export-to reaches the daemon, not just the client
        run: python3 tools/test_export_to_reaches_the_daemon.py
      - name: A --shared client outside the project attaches to the running server
        # fact:shared-attach-by-absolute-path-missed-the-running-server-and-spawned-a-rival-2026-09-22:
        # a relative graph path in the rendezvous was read against the READER's
        # cwd, so a hub or script outside the project spawned a rival that lost
        # the store lock. Real binary, two clients, two folders.
        run: python3 tools/test_shared_attach_from_another_folder.py
      - name: The usage ledger holds the verb and never the object (req:feedback-on-reflow2-is-computed-from-a-record-the-server-kept)
        # The ledger is written in the server's call_tool, which only a wire
        # call passes: this drives the real binary, writes a requirement with
        # an unmistakable id and statement, and requires that neither appears
        # anywhere in the ledger or the report — shown to fail on an
        # argument-leak mutation before it was trusted.
        run: python3 tools/test_feedback_is_a_computed_tally.py
      - name: A lesson is served at the step it concerns (req:a-lesson-is-served-at-the-step-it-concerns)
        # tools/list is the listing a harness reads before every call; only the
        # wire shows the lesson landing on exactly one tool's description and
        # the rest of the surface byte-identical, in one process, before/after.
        run: python3 tools/test_a_lesson_is_served_at_the_step.py
      - name: The --call door, driven the way a VS Code agent drives it (real binary)
        # req:init-installs-the-terminal-route-for-vs-code-and-update-keeps-it-current:
        # a scratch project set up with `reflow2_init.py --harness vscode-cli`,
        # the real `reflow2` command on PATH, then discovery, every runnable
        # command the installed instructions show, a write, the refusal shapes,
        # a held design, the export kept current, and the VS Code hooks run as
        # their file says. Fails, never skips, when the binary is missing.
        run: python3 tools/test_call_door.py
      - name: Nudge-path suite (the REGISTERED hook, run as registered)
        # req:nudge-path-proven: test_loop_nudge covers the script's logic given
        # its inputs, and passed the whole time nobody had checked the hook was
        # installed. This reads .claude/settings.json, runs the command it finds,
        # and asserts the JSON block decision the harness actually consumes.
        run: python3 tools/test_nudge_path.py
      - name: Stale-seat suite (two real graphs, one shared export file)
        # req:stale-seat-knows: a seat whose graph never caught up must not
        # replace the shared design with a complete-but-older document. Two
        # separate servers and a real file, because that is the shape of the bug.
        run: python3 tools/test_stale_seat.py
      - name: Degraded-server + held-graph-snapshot suite (measured against a real lock)
        # The fleet outage of 2026-07-25: a peer that cannot take the single-writer
        # lock must still handshake and say why, instead of dying before any tool
        # exists. Both sides of a REAL held lock, so it cannot pass against a mock.
        run: python3 tools/test_degraded_server.py
      - name: Smoke test over real stdio
        run: python3 tools/smoke_mcp.py
      - name: an empty answer says which empty it is (wire-level class gate)
        run: python3 tools/empty_speaks.py
      - name: Every argument refusal names the tool and the field path (on the wire, probes generated from every schema)
        run: python3 tools/refusal_speaks.py
      - name: Toolsnaps — served surface matches the committed goldens (BL-76)
        run: python3 tools/toolsnap.py
      - name: The confusability replica ranks as find_tools does
        # tools/tool_confusability.py scores the toolsnaps offline, and its
        # --baseline rewrites the find_tools rank ratchet. It agreed with the
        # live ranker on 186 of 193 queries while its header claimed 185 of
        # 185, because it scored text tools/list adds and find_tools never sees
        # (fact:the-confusability-replica-ranks-a-bulk-door-sentence-find-tools-never-sees-2026-10-03).
        # This asks the real binary every corpus query and fails on any top-1
        # disagreement, so the next list-time addition is caught when it lands.
        run: python3 tools/tool_confusability.py --validate
      - name: Every oversized reply offers a bound (the class, not the instance)
        # Toolsnaps pins the tools that EXIST, so a NEW tool returning 126 KB
        # with no `budget_chars` is a clean golden diff and a green build. This
        # is the check that notices. Measured 2026-09-13: 3 of 181 tools were
        # bounded and nine exceeded the 30,000-char default, because each of the
        # three had been fixed by hand after somebody personally met it.
        #
        # ⚠️ IT SEEDS A REAL DESIGN FROM THE COMMITTED EXPORT AND FAILS IF
        # NOTHING OVERFLOWED. On an empty graph every reply is small and the
        # gate would pass having checked nothing — "no tool overflowed" and "I
        # could not make any tool overflow" must not share an exit code.
        run: python3 tools/replies_are_bounded.py
      - name: A reply carries its payload once, on every tool (the class, not one tool)
        # The invariant was pinned in tests/reply_is_sent_once.rs on ONE tool
        # (detect_gaps) out of 191, in a crate that enumerates the served
        # surface for a dozen other properties. Measured 2026-09-20: a second
        # reply builder in tools/skills_tools.rs predated the signpost change
        # and six tools were still sending the payload twice to every client —
        # get_instructions at 64,120 bytes on the wire for 31,374 of payload.
        #
        # AND THE COST WAS NOT ONLY BYTES: content_policy::apply rewrites a
        # reply only if it is ALREADY in signpost shape, so the per-client rule
        # was inert on exactly those six, and OpenCode's empty-block fallback
        # never fired on the tools carrying the instructions and the skills.
        #
        # ⚠️ IT SEEDS A REAL DESIGN FROM THE COMMITTED EXPORT AND FAILS IF IT
        # MEASURED NOTHING, for the same reason as the gate above.
        run: python3 tools/a_reply_is_sent_once.py
      - name: Seat identity survives every transport (one client, one seat)
        run: python3 tools/stateless_seat_probe.py
      - name: Phase-coverage trial (13/13 regression gate)
        run: python3 tools/phase_trial.py
      - name: Process-model probe
        run: python3 tools/model_the_loop.py
      - name: Coherent-erosion trial
        run: python3 tools/coherent_erosion_trial.py
